<!doctype html><meta charset="utf-8"><title>Fruit attachment review</title>
<style>body{font:16px system-ui;background:#ecf0e8;color:#22382c;margin:24px}canvas{background:#d9e1d2;max-width:100%}button{padding:10px;margin:8px}#models{display:flex;gap:16px;flex-wrap:wrap}.model{width:470px}#frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0}h2{margin-top:32px}video{width:720px;max-width:100%}</style>
<h1>Attachment inspection</h1><div id="status">Loading models…</div><div id="models"><div class="model"><h2>Banana</h2><button id="closed">Closed / start</button><button id="open">Peel fully</button><button id="middle">Halfway</button><canvas id="banana" width="470" height="380"></canvas></div><div class="model"><h2>Apple states</h2><select id="state" aria-label="Apple state"></select><canvas id="apple" width="470" height="380"></canvas></div></div>
<h2>Recording</h2><div id="metadata"></div><video id="video" src="recording.mp4" controls muted preload="auto"></video><h2>Recording frames</h2><div id="frames"></div>
<script type="module">
import * as THREE from '../../app/assets/fruit-window/vendor/three.module.js';import {GLTFLoader} from '../../app/assets/fruit-window/vendor/GLTFLoader.js';
const loader=new GLTFLoader(),status=document.querySelector('#status');
function setup(id){const canvas=document.querySelector('#'+id),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(470,380,false);renderer.setClearColor('#d9e1d2');renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,470/380,.01,100);camera.position.set(.34,.23,.43);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x668060,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(2,4,4);scene.add(sun);const holder=new THREE.Group();scene.add(holder);return {scene,camera,holder,render(){scene.updateMatrixWorld(true);renderer.render(scene,camera);},set(model){holder.clear();model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),container=new THREE.Group();container.add(model);model.position.sub(center);container.scale.setScalar(.24/Math.max(size.x,size.y,size.z));holder.add(container);this.render();return container;}};}
try{const banana=setup('banana'),fruit=await loader.loadAsync('banana.glb');banana.set(fruit.scene);const mixer=new THREE.AnimationMixer(fruit.scene),clip=fruit.animations[0],action=mixer.clipAction(clip);action.setLoop(THREE.LoopOnce);action.clampWhenFinished=true;action.play();function time(t){action.reset().play();mixer.setTime(t);banana.render();document.querySelector('#banana').dataset.time=t;};time(0);document.querySelector('#closed').onclick=()=>time(0);document.querySelector('#middle').onclick=()=>time(clip.duration*.5);document.querySelector('#open').onclick=()=>time(clip.duration-.001);const apple=setup('apple'),pack=await loader.loadAsync('apples.glb'),states=pack.scene.getObjectByName('RootNode').children;const options=document.querySelector('#state');for(const item of states){const option=document.createElement('option');option.value=item.name;option.textContent=item.name;options.append(option);}function show(){const source=pack.scene.getObjectByName(options.value),copy=source.clone(true);apple.set(copy);apple.holder.rotation.y=Math.PI;apple.render();document.querySelector('#apple').dataset.state=options.value;}options.onchange=show;options.value='APPLE_red_Bitten';show();status.textContent='Loaded: banana skin/animation and all six apple variants.';}catch(error){status.textContent=error.stack;console.error(error);}
</script>
<script>
const video=document.querySelector('#video');video.addEventListener('loadedmetadata',async()=>{document.querySelector('#metadata').textContent=JSON.stringify({seconds:video.duration,width:video.videoWidth,height:video.videoHeight});for(let i=0;i<9;i++){const t=Math.min(video.duration-.05,video.duration*i/9);await new Promise(resolve=>{video.onseeked=resolve;video.currentTime=t+.001;});const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');canvas.width=640;canvas.height=Math.round(640*video.videoHeight/video.videoWidth);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);caption.textContent=t.toFixed(1)+'s';figure.append(caption,canvas);document.querySelector('#frames').append(figure);}video.onseeked=null;video.currentTime=0;});
</script>
