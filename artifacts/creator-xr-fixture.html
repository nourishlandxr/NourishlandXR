<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1d3326}#scene{display:block;width:100vw;height:100vh}#app{margin:0;padding:0}#label{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#edf2df;font:14px system-ui;pointer-events:none}
</style></head><body><canvas id="scene"></canvas><div id="app"></div><div id="label">XR Creator · stereo browser preview · physical headset acceptance pending</div><script type="module">
import * as THREE from '/xr/vendor/three.module.min.js';
import {mountCreatorXrWorklist} from '/xr/services/creatorXrWorklist.js';
import {CREATOR_XR_SURFACE} from '/xr/services/creatorXrWorkspace.js';
import {createSpatialDashboardMirror,spatialDashboardPanelFromViewer} from '/xr/services/spatialDashboardMirror.js';
const root=document.getElementById('app'),canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(1600,1000,false);
const scene=new THREE.Scene();scene.background=new THREE.Color('#8daba6');scene.fog=new THREE.Fog('#91aaa0',4,12);scene.add(new THREE.HemisphereLight('#fff4da','#344527',2));
const sun=new THREE.DirectionalLight('#ffe9bd',2);sun.position.set(-3,8,2);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#68824a',roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
for(let i=0;i<14;i++){const x=(i%2?1:-1)*(1.2+(i%4)*.8),z=-2-Math.floor(i/2)*1.15;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.07,.11,2),new THREE.MeshStandardMaterial({color:'#705b3a'}));trunk.position.set(x,1,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,2),new THREE.MeshStandardMaterial({color:['#345e3a','#507f49','#5f8847'][i%3],roughness:1}));crown.position.set(x,2.3,z);crown.scale.y=1.3;scene.add(crown);}
const path=new THREE.Mesh(new THREE.PlaneGeometry(1,20),new THREE.MeshStandardMaterial({color:'#b9b48c',roughness:1}));path.rotation.x=-Math.PI/2;path.position.set(0,.003,-8);scene.add(path);
const camera=new THREE.PerspectiveCamera(70,.8,.02,30);let viewer=new THREE.Matrix4().makeTranslation(0,1.65,0),pose,texture,plane,mirror;
const place=()=>{pose=spatialDashboardPanelFromViewer(viewer.elements,{width:CREATOR_XR_SURFACE.metresWide,height:CREATOR_XR_SURFACE.metresHigh,distance:CREATOR_XR_SURFACE.distance,drop:.04});if(plane)plane.position.copy(pose.center);};place();
function draw(){if(!plane)return;renderer.resetState();renderer.setScissorTest(true);for(let eye=0;eye<2;eye++){camera.position.set(viewer.elements[12]+(eye? .032:-.032),1.65,0);renderer.setViewport(eye*800,0,800,1000);renderer.setScissor(eye*800,0,800,1000);renderer.render(scene,camera);}renderer.setScissorTest(false);}
window.xrActions=[];let worklist=mountCreatorXrWorklist(root,{projectId:'garden',siteId:'s',projectName:'Learning garden',areaName:'Herb bed',getRecords:()=>[{areaName:'Herb bed',marker:{id:'ginger',name:'Ginger clump',type:'plant'}},{areaName:'Herb bed',marker:{id:'totem',name:'Entrance Totem',type:'area_checkpoint'}}],onInspect:r=>xrActions.push('inspect:'+r.marker.id),onPlace:r=>xrActions.push('place:'+r.marker.id),onKnowledge:r=>xrActions.push('knowledge:'+r.marker.id),onClose:()=>xrActions.push('close'),onOpenTool:v=>xrActions.push('screen:'+v),onAction:v=>xrActions.push(v),onRecenter:()=>{place();draw();}});
mirror=createSpatialDashboardMirror({gl:renderer.getContext(),root,width:960,height:740,background:null,ink:'#f1f1e3',onUpdate(){if(texture){texture.needsUpdate=true;draw();}},onError:error=>window.fixtureError=error.message});
texture=new THREE.CanvasTexture(mirror.canvas);texture.colorSpace=THREE.SRGBColorSpace;
plane=new THREE.Mesh(new THREE.PlaneGeometry(CREATOR_XR_SURFACE.metresWide,CREATOR_XR_SURFACE.metresHigh),new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide}));plane.position.copy(pose.center);scene.add(plane);
const point=selector=>{const element=root.querySelector(selector);if(!element)throw Error('Missing '+selector);const a=element.getBoundingClientRect(),b=root.getBoundingClientRect();return {x:a.left-b.left+a.width/2,y:a.top-b.top+a.height/2};};
window.xrFixture={root,worklist,mirror,draw,point,async activate(selector){const p=point(selector);if(!mirror.activateAt(p.x,p.y))throw Error('No target '+selector);await mirror.refresh();},async capture(){await document.fonts.ready;await root.querySelector('.creator-brand-mark img').decode();await mirror.refresh();draw();return mirror.canvas.toDataURL();},alpha(){const pixels=mirror.canvas.getContext('2d').getImageData(0,0,960,740).data;let partial=0,clear=0,solid=0;for(let i=3;i<pixels.length;i+=4){if(pixels[i]===0)clear++;else if(pixels[i]<250)partial++;else solid++;}return {partial,clear,solid};},get pose(){return structuredClone(pose);},moveViewer(x){viewer.makeTranslation(x,1.65,0);draw();},glError(){return renderer.getContext().getError();},destroy(){worklist.destroy();mirror.destroy();texture.dispose();renderer.dispose();}};
await mirror.refresh();window.fixtureReady=true;draw();
</script></body></html>
