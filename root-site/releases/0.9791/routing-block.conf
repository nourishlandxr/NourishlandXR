# BEGIN Nourishland canonical routes
DirectoryIndex index.html index.php
ErrorDocument 404 /404.html
ErrorDocument 410 /404.html
<IfModule mod_rewrite.c>
RewriteEngine On
# Only visitor entry routes change; application files and API paths stay intact.
RewriteRule ^vision/?$ /about/ [R=301,L,NE]
RewriteRule ^vision-2/?$ /about/ [R=301,L,NE]
RewriteRule ^what-is-nourish-land/?$ /about/ [R=301,L,NE]
RewriteRule ^start-here/?$ /education/ [R=301,L,NE]
RewriteRule ^food-forests-2/?$ /food-forests/ [R=301,L,NE]
RewriteRule ^a-food-forest-story/?$ /food-forests/story/ [R=301,L,NE]
RewriteRule ^web-of-life/?$ /food-forests/guide/ [R=301,L,NE]
RewriteRule ^food-forest-education/?$ /education/ [R=301,L,NE]
RewriteRule ^plant-literacy/?$ /immersive-learning/ [R=301,L,NE]
RewriteRule ^plant-literacy-2/?$ /immersive-learning/ [R=301,L,NE]
RewriteRule ^crops-of-the-future/?$ /food-forests/guide/ [R=301,L,NE]
RewriteRule ^hillyards-food-forest/?$ /hillyards/ [R=301,L,NE]
RewriteRule ^demonstration-sites/hillyards-food-forest-gardens/?$ /hillyards/ [R=301,L,NE]
RewriteRule ^demonstration-sites/?$ /places/ [R=301,L,NE]
RewriteRule ^demonstration-sites/daleys-fruit-tree-nursery-demonstration-landscapes/?$ /places/ [R=301,L,NE]
RewriteRule ^demonstration-sites/expanding-demonstration-network/?$ /collaborate/ [R=301,L,NE]
RewriteRule ^food-forest-network/?$ /collaborate/ [R=301,L,NE]
RewriteRule ^workshops/?$ /collaborate/ [R=301,L,NE]
RewriteRule ^programs/?$ /collaborate/ [R=301,L,NE]
RewriteRule ^food-forest-propagation-programs/?$ /collaborate/ [R=301,L,NE]
RewriteRule ^nourishland-foundation-program/?$ /collaborate/ [R=301,L,NE]
RewriteRule ^services/?$ /platform/ [R=301,L,NE]
RewriteRule ^contact-us/?$ /contact/ [R=301,L,NE]
RewriteRule ^east-timor/?$ - [G,L]
RewriteRule ^2026/01/11/hello-world/?$ - [G,L]
RewriteRule ^(?:wp-sitemap(?:-[a-z0-9-]+)?|sitemap_index)\.xml$ /sitemap.xml [R=301,L,NE]
RewriteCond %{THE_REQUEST} \s/+index\.php(?:[?\s]) [NC]
RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
RewriteCond %{QUERY_STRING} !(?:^|&)rest_route= [NC]
RewriteRule ^index\.php$ / [R=301,L,NE]
RewriteRule ^(?:(?:xr|app)/)?v2(?:/mobile-study)?(?:/index\.html)?/?$ / [R=301,L,NE]
RewriteRule ^(?:xr|app)/v2/full-3d(?:/index\.html)?/?$ /experience/ [R=301,L,NE]
RewriteRule ^(?:xr|app)/(creator|demos|account|admin|field)(?:/index\.html)?/?$ /$1/ [R=301,L,NE]
RewriteRule ^(?:xr|app)/platform\.html$ /explorer/ [R=301,L,NE]
RewriteCond %{QUERY_STRING} ^$
RewriteRule ^(?:xr|app)(?:/index\.html)?/?$ /platform/ [R=301,L,NE]
RewriteRule ^xr(?:/index\.html)?/?$ /app/ [R=301,L,NE]
# THE_REQUEST prevents an internal DirectoryIndex lookup becoming a redirect loop.
RewriteCond %{THE_REQUEST} \s/+[^?\s]*index\.html(?:[?\s]) [NC]
RewriteRule ^((?:education|platform|food-forests(?:/story|/guide)?|immersive-learning|places|hillyards|collaborate|about|contact|creator|explorer|field|demos|account|admin)/)?index\.html$ /$1 [R=301,L,NE]
# WordPress administration and REST remain reachable; retired public theme pages do not.
RewriteCond %{REQUEST_URI} !^/(?:xr|xr-api|api|app|wp-admin|wp-json)(?:/|$) [NC]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ - [R=404,L]
</IfModule>
# END Nourishland canonical routes
