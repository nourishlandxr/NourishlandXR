<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Moringa and Pigeon Pea comparison</title>
  <desc id="desc">A monochrome field-guide comparison, with Moringa foliage and pods above a Pigeon Pea shrub branch.</desc>
  <defs>
    <filter id="mono"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="gamma" amplitude="1.08" exponent=".86" offset="-.03"/><feFuncG type="gamma" amplitude="1.08" exponent=".86" offset="-.03"/><feFuncB type="gamma" amplitude="1.08" exponent=".86" offset="-.03"/></feComponentTransfer></filter>
    <clipPath id="upper"><rect x="34" y="76" width="832" height="500" rx="28"/></clipPath>
    <clipPath id="lower"><rect x="34" y="630" width="832" height="500" rx="28"/></clipPath>
  </defs>
  <rect width="900" height="1200" rx="34" fill="#f2f0eb"/>
  <g filter="url(#mono)" clip-path="url(#upper)"><image href="../moringa-oleifera.jpg" x="34" y="76" width="832" height="500" preserveAspectRatio="xMidYMid slice"/></g>
  <g filter="url(#mono)" clip-path="url(#lower)"><image href="../pigeon-pea-cajanus-cajan.png" x="34" y="630" width="832" height="500" preserveAspectRatio="xMidYMid slice"/></g>
  <path d="M58 578H842" stroke="#77736c" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#22221f">
    <text x="62" y="54" font-size="24" font-weight="700" letter-spacing="4">MORINGA · CANOPY, FLOWER, POD</text>
    <text x="62" y="1172" font-size="24" font-weight="700" letter-spacing="4">PIGEON PEA · SHRUB, FLOWER, SEED</text>
  </g>
</svg>
