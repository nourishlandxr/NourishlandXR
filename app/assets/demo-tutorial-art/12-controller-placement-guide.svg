    <path d="M774 542v-58" stroke-width="8"/>
    <path d="M735 484h78l-39-41Z" fill="#282a28" stroke-width="7"/>
  </g>
  <g fill="#252624" font-family="Arial, sans-serif" font-weight="700">
    <text x="109" y="554" font-size="21" letter-spacing="2">RIGHT STICK</text>
    <text x="104" y="591" font-size="17" letter-spacing="1">UP / DOWN</text>
    <text x="660" y="618" font-size="21" letter-spacing="2">TRIGGER</text>
    <text x="659" y="653" font-size="17" letter-spacing="1">CONFIRM PLACE</text>
  </g>
  <path d="M64 1015H836" stroke="#77736c" stroke-width="2"/>
  <text x="64" y="1070" fill="#242522" font-family="Arial, sans-serif" font-size="21">Joystick adjusts distance. The tag may sit above ground.</text>
