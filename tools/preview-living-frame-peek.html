<!doctype html><html lang="en"><meta charset="utf-8"><title>Living Frame 3D peek review</title><style>body{background:#172126;color:#edf4ea;font:16px system-ui;margin:20px}canvas{display:block;width:min(1100px,100%)}button{width:48px;height:48px;border-radius:8px;margin:8px}label{margin:16px}</style><h1>Living Frame · demo 3D garden</h1><p>Actual native XR renderer. Lean changes the garden perspective inside the frame.</p><label>Lean <input id="lean" type="range" min="-.45" max=".45" step=".01" value="0"></label><canvas width="1100" height="820"></canvas><pre id="status">Preparing 3D garden…</pre><script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
