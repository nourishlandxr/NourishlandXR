<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brush controller V2</title>
<style>body{margin:0;background:#14251f;color:#f1f3e8;font:16px system-ui}header,footer{padding:20px 28px}h1{margin:0;font-size:26px}p{line-height:1.5;color:#bacfc2}canvas{width:100%;height:65vh;display:block;touch-action:none}button{width:48px;height:48px;border:1px solid #81aa98;background:#254838;color:#fff;border-radius:8px;font-size:22px;cursor:pointer}button[aria-pressed=true]{outline:2px solid #e1eab1}footer{display:flex;gap:20px;align-items:center;flex-wrap:wrap}label{display:flex;gap:10px;align-items:center}small{color:#c3d8c7}</style>
<header><h1>Brush V2 · Controller mounted point</h1><p>A short tapered point sits directly on the controller. Drag to inspect.<br>Trigger: paint · Grip: line width · A + trigger: erase · B: undo.</p></header><canvas aria-label="Rotatable brush V2 controller"></canvas>
<footer><button id="trigger" aria-label="Trigger · paint" title="Trigger · paint" aria-pressed="false">☝</button><button id="a" aria-label="A · erase with trigger" title="A · erase with trigger" aria-pressed="false">A</button><button id="b" aria-label="B · undo" title="B · undo" aria-pressed="false">B</button><label>Grip pressure · line width <input id="grip" type="range" min="0" max="1" step=".01" value="0"></label><small id="status">Loading bundled Meta profile…</small></footer>
<script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
import {createWelcomeControllerGuide} from '../app/services/welcomeControllerGuide.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#14251f');scene.add(new THREE.HemisphereLight('#fff5e3','#354739',2));const light=new THREE.DirectionalLight('#ffffff',2);light.position.set(.2,.5,.3);scene.add(light);
const camera=new THREE.PerspectiveCamera(35,1,.005,5);camera.position.set(.11,.15,-.24);camera.lookAt(0,-.015,-.025);
const guide=createWelcomeControllerGuide(scene),source={handedness:'right',profiles:['meta-quest-touch-plus'],gamepad:{buttons:Array.from({length:6},()=>({value:0,pressed:false})),axes:[0,0,0,0]}},input={source,matrix:new THREE.Matrix4().elements,trigger:false,down:false};await guide.preload([source]);
document.querySelector('#status').textContent='Official profile loaded · drag to rotate';
for(const [id,index] of [['trigger',0],['a',4],['b',5]])document.querySelector('#'+id).onclick=e=>{const b=source.gamepad.buttons[index];b.pressed=!b.pressed;b.value=b.pressed?1:0;e.currentTarget.setAttribute('aria-pressed',String(b.pressed));};
let yaw=-.35,pitch=0,drag=null,last=0;canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.01;pitch+=(e.clientY-drag.y)*.01;drag={x:e.clientX,y:e.clientY};};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
function frame(time){requestAnimationFrame(frame);if(document.hidden || time-last<30)return;const dt=Math.min(.06,(time-last)/1000);last=time;const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio()) || canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}input.matrix=new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(pitch,yaw,0)).elements;input.trigger=source.gamepad.buttons[0].pressed;const grip=Number(document.querySelector('#grip').value);source.gamepad.buttons[1]={value:grip,pressed:grip>.5};input.down=grip>.5;guide.update(dt,[input],'brush',null,false,1,'paint',{handReveal:{right:1},paintColour:'#86e7d0'});renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></html>
