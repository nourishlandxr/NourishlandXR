<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Frame · head entry portal test</title><style>body{margin:0;background:#172126;color:#edf4ea;font:15px system-ui}canvas{display:block}header{position:fixed;top:0;padding:12px;background:#172126df;z-index:2}button,input{margin:5px}#status{position:fixed;bottom:0;background:#172126dc;padding:12px}button{padding:8px}label{display:inline-block}</style></head><body><header><b>Living Frame · portal mechanics</b> <span id="version"></span><br><button id="outside">Outside frame</button><button id="enter">Head inside</button><button id="xr" disabled>Test in headset</button><button id="exit" hidden>Exit XR</button><br><label>Move through frame <input id="depth" type="range" min="0" max="4.3" step=".01" value="0"></label><label>Lean <input id="lean" type="range" min="-.6" max=".6" step=".01" value="0"></label><label>Look around <input id="yaw" type="range" min="-180" max="180" value="0"></label><label>Look up/down <input id="pitch" type="range" min="-75" max="75" value="0"></label></header><div id="status">Preparing portal…</div><script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {createPortalPlantStudy} from '../app/services/portalPlantStudy.js';
import {prepareLivingFrameModel,createLivingFrameModel} from '../app/services/livingFrameModel.js';
import {createPeekPortalExperience} from '../app/services/peekPortalExperience.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
const $=id=>document.getElementById(id);$('version').textContent='V'+BUILD_INFO.version;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,stencil:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x172126,1);renderer.localClippingEnabled=true;renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(65,1,.02,40),portal=createPortalPlantStudy();portal.root.position.set(0,1.6,-1.8);scene.add(portal.root,new THREE.HemisphereLight(0xe6f4ff,0x283320,3));const light=new THREE.PointLight(0xa8d7ff,18,10);light.position.set(0,2,-3);scene.add(light);
let entry,frame,session,placing=false;const materials=[];
try{entry=await prepareLivingFrameModel('sd');entry.users++;frame=entry.asset.scene.clone(true);frame.traverse(o=>{if(o.isMesh){o.renderOrder=3;o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone();for(const m of Array.isArray(o.material)?o.material:[o.material]){m.stencilWrite=false;materials.push(m);}}});frame.position.set(0,-.016,.012);portal.root.add(frame);const mixer=new THREE.AnimationMixer(frame);for(const clip of entry.asset.animations){const a=mixer.clipAction(clip);a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;a.play();}mixer.setTime(60);portal.rim.visible=false;}catch(e){$('status').textContent=e.message;}
const nativeTest=new URLSearchParams(location.search).get('native')==='1';let nativePortal,nativeFrame;
if(nativeTest){nativePortal=createPeekPortalExperience();await nativePortal.ready;nativePortal.setContext(renderer.getContext());nativePortal.begin(new THREE.Matrix4().makeTranslation(0,1.6,-1.8).elements,()=>{});nativeFrame=createLivingFrameModel();nativeFrame.setContext(renderer.getContext());}
function pose(){camera.position.set(Number($('lean').value),1.6,1.4-Number($('depth').value));camera.rotation.set(Number($('pitch').value)*Math.PI/180,Number($('yaw').value)*Math.PI/180,0,'YXZ');camera.updateMatrixWorld(true);}
for(const id of ['depth','lean','yaw','pitch'])$(id).oninput=pose;
$('outside').onclick=()=>{$('depth').value=0;$('lean').value=$('yaw').value=$('pitch').value=0;portal.resetEntry();pose();};$('enter').onclick=()=>{$('depth').value=3.5;$('lean').value=$('yaw').value=$('pitch').value=0;pose();};pose();
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();
let mode=null;if(navigator.xr&&isSecureContext){for(const candidate of ['immersive-ar','immersive-vr'])if(await navigator.xr.isSessionSupported(candidate).catch(()=>false)){mode=candidate;break;}}$('xr').disabled=!mode;
$('xr').onclick=async()=>{try{session=await navigator.xr.requestSession(mode,{requiredFeatures:['local-floor'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});placing=true;portal.resetEntry();renderer.setClearColor(0x172126,mode==='immersive-ar'?0:1);await renderer.xr.setSession(session);$('exit').hidden=false;session.addEventListener('end',()=>{session=null;$('exit').hidden=true;renderer.setClearColor(0x172126,1);portal.root.position.set(0,1.6,-1.8);portal.root.rotation.set(0,0,0);portal.resetEntry();pose();resize();});}catch(e){$('status').textContent=e.message;}};$('exit').onclick=()=>session?.end();
renderer.setAnimationLoop((time,xrFrame)=>{if(session&&xrFrame){const p=xrFrame.getViewerPose(renderer.xr.getReferenceSpace());if(p){const head=p.transform.position,q=p.transform.orientation;if(placing){const f=new THREE.Vector3(0,0,-1).applyQuaternion(new THREE.Quaternion(q.x,q.y,q.z,q.w));f.y=0;f.normalize();portal.root.position.set(head.x+f.x*1.8,head.y,head.z+f.z*1.8);portal.root.rotation.y=Math.atan2(-f.x,-f.z);placing=false;}camera.position.set(head.x,head.y,head.z);camera.updateMatrixWorld(true);}}portal.update(camera);
 if(nativeTest&&!session){const gl=renderer.getContext();gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);gl.clearColor(.09,.13,.15,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT|gl.STENCIL_BUFFER_BIT);camera.matrixWorldInverse.copy(camera.matrixWorld).invert();nativeFrame.update(180000,{show:true,frameToken:time});nativePortal.drawNative(gl,{projectionMatrix:camera.projectionMatrix.elements,transform:{matrix:camera.matrixWorld.elements,inverse:{matrix:camera.matrixWorldInverse.elements}}},nativeFrame,camera.matrixWorld.elements);$('status').dataset.glError=String(gl.getError());}
 else renderer.render(scene,camera);
 $('status').textContent=((nativeTest?nativePortal.inside:portal.inside)?'INSIDE — look sideways, up, down or behind.':'OUTSIDE — lean to see depth, then move your head through the opening.')+' Original placeholder flower · content review comes later. '+(nativeTest?'Native XR renderer with simulated camera. ':!mode?'Desktop simulation; headset unavailable here.':'Headset test available.');});
window.addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);session?.end();nativePortal?.destroy();nativeFrame?.destroy();portal.dispose();for(const m of materials)m.dispose();if(entry)entry.users--;renderer.dispose();},{once:true});
</script></body></html>
