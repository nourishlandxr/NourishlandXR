<!doctype html><html lang="en"><meta charset="utf-8"><title>Welcome tutorial XR input verification</title>
<link rel="stylesheet" href="../app/style.css"><link rel="stylesheet" href="../app/pim.css">
<style>body{margin:20px;background:#17271e;color:#eee;font:16px system-ui}button{padding:12px}canvas{display:block;width:960px;height:620px;max-width:100%;margin-top:16px}#result{white-space:pre-wrap}</style>
<h1>Welcome tutorial · native renderer and grip verification</h1><button id="run">Run XR event checks</button><pre id="result">Ready</pre><canvas id="view" width="960" height="620"></canvas><div id="panel"></div>
<script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
import {createWelcomePracticeXR} from '../app/services/welcomePracticeXR.js';
import {createPimInfoPanel,welcomeComfortPanelPose} from '../app/services/pimInfoPanel.js';
import {createWelcomeComfortOptions} from '../app/services/welcomeComfortOptions.js';
const result=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{
 let tutorial,panel;
 try{
  const checks=[],check=(condition,message)=>{if(!condition)throw Error(message);checks.push('PASS '+message);};
  const gl=document.querySelector('#view').getContext('webgl2',{alpha:false});if(!gl)throw Error('WebGL2 unavailable');
  const session=new EventTarget(),space=new EventTarget(),source={handedness:'right',targetRayMode:'tracked-pointer',targetRaySpace:{},gripSpace:{},gamepad:{buttons:[{pressed:false},{pressed:false}],axes:[0,0,0,0]}};
  session.inputSources=[source];session.visibilityState='visible';
  const viewer=new THREE.Matrix4().makeTranslation(0,1.6,0).elements;
  const centre=welcomeComfortPanelPose(viewer).center;
  let rayMatrix=new THREE.Matrix4().lookAt(new THREE.Vector3(0,1.3,0),new THREE.Vector3(centre.x,centre.y,centre.z),new THREE.Vector3(0,1,0)).setPosition(0,1.3,0);
  const frame={session,getPose:()=>({transform:{matrix:rayMatrix.elements}})};
  const voice={status:()=>({playing:false,paused:false,muted:true}),speak(){},stop(){},unlock(){},pause(){},resume(){}};
  panel=createPimInfoPanel({root:document.querySelector('#panel'),headset:true,inputOccupied:s=>tutorial?.stage.isHolding(s)});panel.recenter();
  tutorial=createWelcomePracticeXR(gl,{voice,isFrameReady:()=>false,onPanelOwns:s=>panel.getHeldInputSource()===s,onHit:ray=>panel.hit(ray)});
  const comfort=createWelcomeComfortOptions({stage:tutorial.stage});panel.setComfortContext(comfort.context());panel.showLearning({title:'',body:'',image:''});panel.attach(gl);panel.suspend(false);
  tutorial.bind(session,space);panel.bindSession(session,space);tutorial.start(viewer,0);await tutorial.stage.loading;
  for(let i=0;i<100;i++)tutorial.update(frame,performance.now()+i*16,viewer,0,[]);
  check(tutorial.stage.phase==='frame','delayed 3D rim holds the opening');
  check(!tutorial.stage.objects.get('orange').visible,'orange stays hidden during the opening');
  tutorial.stage.previewLesson('grab');
  const camera=new THREE.PerspectiveCamera(70,960/620,.01,20);camera.position.set(0,1.6,.15);camera.lookAt(-.25,1.15,-1.3);camera.updateMatrixWorld();
  const view={projectionMatrix:camera.projectionMatrix.elements,transform:{inverse:{matrix:camera.matrixWorldInverse.elements}}};
  let time=performance.now();
  function draw(){gl.viewport(0,0,960,620);gl.clearColor(.09,.15,.11,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);tutorial.draw(view);panel.draw(view);}
  for(let i=0;i<100;i++){time+=16;tutorial.update(frame,time,viewer,0,[]);panel.update(viewer,time,null,frame);draw();}
  const ray=()=>({origin:{x:rayMatrix.elements[12],y:rayMatrix.elements[13],z:rayMatrix.elements[14]},direction:{x:-rayMatrix.elements[8],y:-rayMatrix.elements[9],z:-rayMatrix.elements[10]}});
  const initial=panel.hit(ray());check(initial?.card.id==='control','native comfort surface receives the controller ray');
  const send=type=>{const event=new Event(type,{cancelable:true});Object.assign(event,{inputSource:source,frame});session.dispatchEvent(event);};
  source.gamepad.buttons[1].pressed=true;send('squeezestart');
  check(panel.getHeldInputSource()===source,'squeeze reaches the normal panel grab listener');
  tutorial.update(frame,time+=500,viewer,0,[]);panel.update(viewer,time,null,frame);draw();
  const before=panel.hit(ray()).center.x;rayMatrix.elements[12]+=.25;
  tutorial.update(frame,time+=16,viewer,0,[]);panel.update(viewer,time,null,frame);draw();
  const moved=panel.hit(ray());check(moved && moved.center.x>before+.15,'panel moves with the held controller');
  check(!tutorial.stage.isHolding(source),'panel grip does not also grab the orange');
  source.gamepad.buttons[1].pressed=false;send('squeezeend');panel.update(viewer,time+=16,null,frame);draw();
  check(panel.getHeldInputSource()===null,'release finishes the panel move');
  const finalX=moved.center.x;rayMatrix.elements[12]+=.2;panel.update(viewer,time+=16,null,frame);draw();
  const retainedRay={origin:{x:moved.center.x,y:moved.center.y,z:moved.center.z+.3},direction:{x:0,y:0,z:-1}};
  check(Math.abs(panel.hit(retainedRay).center.x-finalX)<.001,'released panel keeps its new world position');
  check(gl.getError()===gl.NO_ERROR,'native tutorial and panel rendering has no GL error');
  result.textContent=checks.join('\n')+'\nHeadset validation remains required.';
 }catch(error){result.textContent='FAIL '+error.stack;}finally{tutorial?.destroy();panel?.destroy();}
};
</script></html>
