<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry · gradual growth</title><style>body{margin:0;background:#203329;color:#edf0e1;font:16px system-ui}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:11px 17px;background:#406148;color:#fff;border:1px solid #a1b795;border-radius:9px}canvas{display:block;width:100%;height:70vh}footer{padding:20px;line-height:1.6}small{color:#c6d2bf}</style></head><body><header><strong>A fuller strawberry plant</strong><span id="version"></span><button id="reset">Start growth</button><button id="pause">Pause</button><button id="ripe">Preview ripe plant</button></header><canvas></canvas><footer><strong>“We don’t have any strawberries yet. Let’s grow some.”</strong><p id="status">Loading…</p><small>Actual tutorial plant · 45 seconds of active growth after sowing and watering · pauses with the experience.</small></footer><script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
import {createWelcomePlantPractice} from '../app/services/welcomePlantPractice.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),root=new THREE.Group();scene.add(root);const garden=createWelcomePlantPractice(root);
scene.add(new THREE.HemisphereLight('#e7edd6','#35432b',2));const light=new THREE.DirectionalLight('#ffe9c4',2);light.position.set(-1,2,1);scene.add(light);
const camera=new THREE.PerspectiveCamera(37,1,.01,10);camera.position.set(.39,.37,.48);camera.lookAt(0,.10,-.08);
let paused=false,phase='grow',last=performance.now();garden.previewPhase('grow');
document.querySelector('#reset').onclick=()=>{garden.reset({station:true});garden.previewPhase('grow');phase='grow';paused=false;document.querySelector('#pause').textContent='Pause';};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};document.querySelector('#ripe').onclick=()=>{garden.previewPhase('harvest');phase='harvest';};
function resize(){const height=Math.max(380,innerHeight*.70);renderer.setSize(innerWidth,height,false);camera.aspect=innerWidth/height;camera.position.set(.39,.37,.48);if(camera.aspect<.8)camera.position.multiplyScalar(.8/camera.aspect);camera.lookAt(0,.10,-.08);camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function tick(time){requestAnimationFrame(tick);const dt=document.hidden || paused?0:Math.min(.06,(time-last)/1000);last=time;garden.update(dt,phase);for(const body of garden.bodies){const object=garden.objects.get(body.id);object.visible=body.visible;object.position.set(body.position.x,body.position.y,body.position.z);}garden.objects.get('watering-can').visible=false;const state=garden.snapshot();document.querySelector('#status').textContent=state.grown?'Ripe fruit · ready to harvest':Math.round(state.growth*100)+'% · '+(state.growth<.42?'Leaves filling out':state.growth<.66?'White flowers appearing':state.growth<.87?'Green strawberries developing':'Strawberries ripening');renderer.render(scene,camera);}requestAnimationFrame(tick);
window.addEventListener('error',e=>document.querySelector('#status').textContent=e.message);
</script></body></html>
