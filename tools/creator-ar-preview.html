<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator AR · local interface lab</title><link rel="stylesheet" href="/app/style.css"><link rel="stylesheet" href="/app/pim.css"><link rel="stylesheet" href="/app/product-v2.css"><style>body{background:#e6eddd;padding:24px;font:16px system-ui;color:#294534} .lab{max-width:800px;margin:auto}.lab>button{padding:12px;margin:4px}.creator-ar-overlay{position:fixed;inset:0;pointer-events:none}.creator-ar-overlay:has(.creator-ar-knowledge-workspace) .creator-ar-control-dock{visibility:hidden}.lab-honeycomb{width:min(100%,720px);height:auto;margin:20px auto;display:block}</style></head><body><main class="lab"><small>LOCAL COMPONENT QA · NOT AN IMMERSIVE AR SESSION</small><h1>Knowledge, in place.</h1><p>The production creator controls and PIM workspace, using an isolated orchard copy. The reference mesh is in memory.</p><button id="sparse">Open Jackfruit</button><button id="deep">Open populated reference</button><button id="honeycomb">Show spatial texture</button><p id="status" role="status"></p><canvas class="lab-honeycomb" id="mesh" width="1000" height="750"></canvas><div id="dom-mesh" style="position:relative;width:100%;height:600px"></div></main><div class="creator-ar-overlay"><div class="creator-ar-control-dock" data-ar-taskbar-version="2"></div></div><script type="module">
import {creatorArControlsMarkup,bindCreatorArControls} from '/app/services/creatorArControls.js';
import {mountCreatorArKnowledge,creatorKnowledgeDocument} from '/app/services/creatorArKnowledge.js';
import {PIGEON_PEA_PIM} from '/app/services/pigeonPeaPim.js';
import {pimToArKnowledge} from '/app/services/pimModel.js';
import {loadPlantProfile} from '/app/services/persistence.js';
import {plantInformationMeshMarkup} from '/app/services/plantInformationMeshView.js';
import {PIM_SPATIAL_LAYOUT_OPTIONS} from '/app/services/plantInformationMesh.js';
import {drawPlantInformationHoneycomb} from '/app/services/plantInformationMeshCanvas.js';
const context=['hilyards_food_forest','main_food_forest','1l1','jackfruit'];
const overlay=document.querySelector('.creator-ar-overlay'),dock=document.querySelector('.creator-ar-control-dock'),status=document.querySelector('#status');
dock.innerHTML=creatorArControlsMarkup();let workspace,record;
const reference=structuredClone(PIGEON_PEA_PIM);
const close=()=>{workspace?.destroy();workspace=null;overlay.querySelector('.creator-ar-knowledge-workspace')?.remove();status.textContent='Returned to the same plant. Placement unchanged.';};
const open=(options={})=>{if(!record)return;const root=document.createElement('section');overlay.append(root);workspace=mountCreatorArKnowledge(root,{record,context,persistence:record.qaPersistence || {},...options,onClose:close});};
document.querySelector('#sparse').onclick=async()=>{record={marker:{id:'jackfruit',name:'Jackfruit'},areaName:'1L1',plantProfile:await loadPlantProfile(...context)};open();};
document.querySelector('#deep').onclick=()=>{record={marker:{id:'pigeon-pea-reference',name:'Pigeon Pea'},areaName:'Reference · not a saved specimen',plantProfile:{common_name:'Pigeon Pea',pim_document:structuredClone(reference)}};record.qaPersistence={load:async()=>record.plantProfile,save:async()=>{}};open();};
bindCreatorArControls(dock,{'[data-ar-add-plant]':()=>{status.textContent='Plant placement selected';dock.querySelector('[data-ar-placement-actions]').hidden=false;},'[data-ar-add-note]':()=>status.textContent='Note placement selected','[data-ar-add-special]':()=>status.textContent='Totem tools selected','[data-ar-select-mode]':()=>status.textContent='Inspect mode selected','[data-ar-view-mode]':()=>status.textContent='View mode selected','[data-ar-knowledge-open]':()=>open(),'[data-ar-exit-session]':()=>status.textContent='Exit selected (component lab only)','[data-ar-confirm-place]':()=>status.textContent='Place action selected (no placement data written)','[data-ar-cancel-place]':()=>{dock.querySelector('[data-ar-placement-actions]').hidden=true;status.textContent='Placement cancelled';}});
document.querySelector('#honeycomb').onclick=()=>{const canvas=document.querySelector('#mesh');drawPlantInformationHoneycomb(canvas.getContext('2d'),canvas,pimToArKnowledge(reference),['scientific-information'],{...PIM_SPATIAL_LAYOUT_OPTIONS});document.querySelector('#dom-mesh').innerHTML=plantInformationMeshMarkup(pimToArKnowledge(reference),['scientific-information'],{...PIM_SPATIAL_LAYOUT_OPTIONS,layoutWidth:800,layoutHeight:600,viewportWidth:800,viewportHeight:600});};
</script></body></html>
