<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nourishland XR · Sun garden study</title><style>body{margin:0;background:#14241f;color:#f5e8cb;font:15px system-ui}canvas{display:block}header{position:fixed;top:18px;left:22px;z-index:5}h1{font:24px Georgia;margin:0 0 8px}nav{position:fixed;bottom:20px;left:22px;z-index:5;background:#14241fe6;padding:12px;border-radius:14px}button{padding:10px;margin:4px;background:#e6d4aa;color:#203b31;border:0;border-radius:8px}label{margin:10px}#state{display:block;margin:6px}</style><header><h1>The sun garden</h1><span>Original spatial study · <span id="version"></span></span></header><nav><button id="outside">Framed view</button><button id="near">At the frame</button><button id="inside">Inside garden</button><label>Lean <input id="lean" type="range" min="-.8" max=".8" step=".01" value="0"></label><span id="state">Scroll to approach · drag to look around</span></nav><script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {createSunGardenPeekStudy} from '../app/services/sunGardenPeekStudy.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
const scene=new THREE.Scene(),portal=createSunGardenPeekStudy(),camera=new THREE.PerspectiveCamera(50,1,.02,100),renderer=new THREE.WebGLRenderer({antialias:true,stencil:true});renderer.localClippingEnabled=true;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x14241f);document.body.append(renderer.domElement);scene.add(portal.root,new THREE.HemisphereLight(0xffeace,0x203f37,2));const light=new THREE.DirectionalLight(0xffe2b2,1.6);light.position.set(-3,6,4);scene.add(light);
let depth=2.7,yaw=0,pitch=0,drag=null,last=performance.now();const lean=document.querySelector('#lean');document.querySelector('#outside').onclick=()=>{depth=2.7;yaw=pitch=0;lean.value=0;};document.querySelector('#near').onclick=()=>{depth=.45;yaw=pitch=0;};document.querySelector('#inside').onclick=()=>{depth=-1.3;yaw=pitch=0;};renderer.domElement.onwheel=e=>{e.preventDefault();depth=Math.max(-5,Math.min(4,depth+e.deltaY*.003));};renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.004;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY];};renderer.domElement.onpointerup=()=>drag=null;
await portal.ready;renderer.setAnimationLoop(()=>{const now=performance.now();portal.advanceAnimation((now-last)/1000);last=now;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();camera.position.set(Number(lean.value),0,depth);camera.rotation.set(pitch,yaw,0,'YXZ');camera.updateMatrixWorld(true);portal.update(camera);document.querySelector('#state').textContent=portal.inside?'Inside the garden · drag to look around':'Scroll to approach · drag to look around';renderer.render(scene,camera);});window.addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);portal.dispose();renderer.dispose();});
</script></html>
