<!doctype html><html lang="en"><meta charset="utf-8"><title>Welcome opening review</title><style>body{background:#14251f;color:#eee;font:16px system-ui;margin:20px}main{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}article{background:#25382e;padding:12px}canvas{width:100%;background:#293d31}audio{width:100%}h1{font-size:24px}</style><h1>Zinnia · opening slides and saved narration</h1><main></main><script type="module">
import {WELCOME_PRACTICE_LESSONS} from '../app/services/welcomePracticeContent.js';
import {WELCOME_NARRATION_BANK} from '../app/services/welcomeNarrationBank.js';
import {drawWelcomeText} from '../app/services/welcomeSpeechPresentation.js';
for(const lesson of WELCOME_PRACTICE_LESSONS.filter(l=>['title','arrival','table','face','zinnia','living-frame'].includes(l.id))){const article=document.createElement('article'),label=document.createElement('p'),canvas=document.createElement('canvas'),audio=document.createElement('audio');canvas.width=1400;canvas.height=1080;label.textContent=lesson.title;audio.controls=true;audio.src='../app/'+WELCOME_NARRATION_BANK.base+lesson.id+'.mp3';const ctx=canvas.getContext('2d');ctx.fillStyle='#fffaf0';drawWelcomeText(ctx,{title:lesson.title,caption:(lesson.paragraphs || [lesson.caption]).join('\n\n'),width:900,top:260,bottom:850,titleSize:88,bodySize:40});article.append(label,canvas,audio);document.querySelector('main').append(article);}
</script></html>
