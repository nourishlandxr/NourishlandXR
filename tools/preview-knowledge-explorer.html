<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Explorer study</title><link rel="stylesheet" href="../app/style.css"><link rel="stylesheet" href="../app/living-objects.css"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#172d29;color:#edf3e4;font:16px/1.6 Manrope,system-ui}main{padding:24px}h1{color:inherit;font-weight:500;margin:0;font-size:28px}.intro{max-width:720px;color:#bcd0c3}#study{position:relative;display:grid;grid-template-columns:minmax(320px,1fr) 480px;gap:30px;min-height:650px}.graph{position:relative;height:530px;background:radial-gradient(ellipse at center,#435949,#213934);border:1px solid #adc6bc55;border-radius:22px}.graph .plant-knowledge-map{position:absolute;inset:0;pointer-events:none}.graph .plant-knowledge-map button{pointer-events:auto}#panels>.nlxr-info-panel{position:absolute!important;top:0!important;right:0!important;left:auto!important;width:480px!important;height:440px!important;margin:0!important;transform:none!important;max-height:none!important}#panels>.nlxr-explorer-companion{position:absolute!important;top:455px!important;right:0!important;left:auto!important;width:480px!important;height:auto!important;bottom:auto!important}#panels .nlxr-explorer-options{gap:5px}#panels .nlxr-explorer-options button{font-size:12px!important;padding:7px 5px!important}#state{color:#d4e0ce;min-height:28px}.preview-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{font:inherit;color:inherit;border:1px solid #adc6bc77;background:#aec6ad15;border-radius:14px;padding:9px 15px;cursor:pointer}#errors{color:#ffcbb4}#panels>.nlxr-settings-companion:not(.nlxr-explorer-companion){z-index:60} @media(max-width:800px){#study{display:block;min-height:1150px}.graph{height:440px}#panels>.nlxr-info-panel{top:470px!important;width:100%!important}#panels>.nlxr-explorer-companion{top:925px!important;width:100%!important}.intro{font-size:14px}}
</style>
<main><h1>Plant knowledge · desktop view</h1><p class="intro">The production graph and Control panel. Desktop stays flat: Tag identifies the plant and Curiosity reveals its relationships. Spatial Explore is available in AR. Scroll the knowledge field to follow deeper branches.</p><div class="preview-actions"><button id="open-growing">Open Growing branch</button><button id="open-soil">Open Soil branch</button><button id="reset-camera">Back to Tag</button></div><p id="state" role="status">Loading knowledge…</p><div id="study"><section class="graph" aria-label="Knowledge structure"></section><section id="panels"></section></div><p id="errors" role="alert"></p></main>
<script type="module">
import {PIGEON_PEA_PIM} from '../app/services/pigeonPeaPim.js';
import {PIGEON_PEA_AR_KNOWLEDGE} from '../app/services/pigeonPeaExample.js';
import {createPimInfoPanel} from '../app/services/pimInfoPanel.js';
import {plantInformationMeshMarkup,reconcilePlantInformationMesh} from '../app/services/plantInformationMeshView.js';
import {knowledgeExplorer,knowledgeExplorerAction,knowledgeExplorerOptions,KNOWLEDGE_MODES} from '../app/services/knowledgeExplorer.js';
import {pimVisibleNodes,pimNodeAtPath,pimCreateInteractionState,pimToggleNodeState} from '../app/services/plantInformationMesh.js';
import {mountKnowledgeDesktopView,disposeKnowledgeDesktopViews} from '../app/services/knowledgeDesktopView.js';
const errors=document.querySelector('#errors');window.addEventListener('error',event=>errors.textContent=event.message);window.addEventListener('unhandledrejection',event=>errors.textContent=String(event.reason));
try{
await document.fonts.ready;
const record={id:'knowledge-study',demoType:'plant',demoPlantPreset:'pigeon-pea',name:'Pigeon Pea',demoSelectedNodeId:'',demoExpandedNodeIds:[]},graph=document.querySelector('.graph');
const knowledge=PIGEON_PEA_AR_KNOWLEDGE;
const panel=createPimInfoPanel({root:document.querySelector('#panels'),simpleDesktop:true,onExplorerAction:(record,action)=>{if(action==='KnowledgeResume' && record.demoSelectedNodeId)panel.select(record,PIGEON_PEA_PIM,record.demoSelectedNodeId);refresh();}});
panel.element.classList.add('is-creator-panel');panel.focusPlant(record,PIGEON_PEA_PIM);
function choose(node){if(node.pimCore){panel.focusPlant(record,PIGEON_PEA_PIM);return;}const state=pimToggleNodeState(knowledge,pimCreateInteractionState(record.demoExpandedNodeIds,record.demoSelectedNodeId),node.path);record.demoSelectedNodeId=state.selectedNodeId;record.demoExpandedNodeIds=[...state.expandedNodeIds];panel.select(record,PIGEON_PEA_PIM,node.path);refresh();}
function refresh(){const options=knowledgeExplorerOptions(record);reconcilePlantInformationMesh(graph,plantInformationMeshMarkup(knowledge,record.demoExpandedNodeIds,{...options,layoutWidth:700,layoutHeight:530,cellWidthPixels:100,compactLabels:true}));mountKnowledgeDesktopView(graph,{record,knowledge,expanded:record.demoExpandedNodeIds,onSelect:choose});panel.refreshExplorer();const nodes=pimVisibleNodes(knowledge,record.demoExpandedNodeIds,options),mode=KNOWLEDGE_MODES[knowledgeExplorer(record).mode].label;document.querySelector('#state').textContent=`${mode} · ${nodes.length} relationship cells · Selected: ${pimNodeAtPath(knowledge,record.demoSelectedNodeId)?.label || 'Pigeon Pea'} · ${record.demoExpandedNodeIds.length} open branches`;}
graph.addEventListener('click',event=>{const button=event.target.closest('[data-pim-node]');if(button)choose(pimNodeAtPath(knowledge,button.dataset.pimNode));});
function openBranch(label){knowledgeExplorerAction(record,'KnowledgeMode:curiosity');function find(nodes){for(const node of nodes || []){if(node.label.toLowerCase().includes(label))return node;const child=find(node.children);if(child)return child;}}const node=find(knowledge.categories);if(node){choose(node);}}
document.querySelector('#open-growing').onclick=()=>openBranch('growing');document.querySelector('#open-soil').onclick=()=>openBranch('ecolog');document.querySelector('#reset-camera').onclick=()=>{knowledgeExplorerAction(record,'KnowledgeMode:tag');refresh();};refresh();
}catch(error){errors.textContent=error.stack || String(error);}
</script></html>
