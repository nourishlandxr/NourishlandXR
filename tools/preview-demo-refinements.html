<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NLXR interaction repairs</title>
<link rel="stylesheet" href="../app/style.css"><link rel="stylesheet" href="../app/pim.css"><link rel="stylesheet" href="../app/product-v2.css"><link rel="stylesheet" href="../app/living-objects.css"><link rel="stylesheet" href="../app/note-widgets.css">
<style>body{margin:0;background:#1b2923}#test-bar{position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;gap:8px;align-items:center;padding:8px;background:#17271ef2;color:#f1f3df;font:14px system-ui}#test-bar button{padding:6px 10px;color:#fff}#test-status{color:#f1f3df}#app{min-height:100vh}</style></head>
<body><header id="test-bar"><strong>Actual demo controls</strong><span id="version"></span><button data-test-stage="intro">Introduction</button><button data-test-stage="native">Native choice</button><button data-test-stage="notes">Notes</button><button data-test-stage="totems">Totems</button><button data-test-stage="map">Map</button><output id="test-status">Ready</output></header><main id="app"></main>
<script type="module">
import {startTemporaryArDemo} from '../app/screens/temporaryArDemo.js';
import {livingMapPreviewRecords} from './demo-living-map-fixture.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
window.renderLaunchScreen=()=>location.href='../app/index.html';
window.addEventListener('error',event=>document.querySelector('#test-status').textContent='ERROR: '+event.message);
const restart=stage=>startTemporaryArDemo(document.querySelector('#app'),{livingMapPreviewRecords:stage==='intro'?null:livingMapPreviewRecords(),refinementPreview:stage});
for(const button of document.querySelectorAll('[data-test-stage]'))button.onclick=()=>restart(button.dataset.testStage);
restart('native');
</script></body></html>
