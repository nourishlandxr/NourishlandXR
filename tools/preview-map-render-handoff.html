<!doctype html><html lang="en"><meta charset="utf-8"><title>Map graphics handoff regression</title>
<style>body{background:#15291c;color:#fff;font:16px system-ui}canvas{width:min(100%,1000px)}button{padding:16px;margin:10px}</style>
<h1>Map graphics handoff regression</h1><p>White panel triangle must remain visible while the map is active and after disposal. Tests both private VAO and the fallback attribute restoration.</p>
<button id="dispose">Continue after map · dispose renderer</button><button id="fallback">Test without VAO</button><button id="restart">Restart</button><output id="status"></output><br><canvas width="1000" height="650"></canvas>
<script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {createDemoLivingMapConcept,createDemoLivingMapPlacement} from '../app/services/demoLivingMapModel.js';
import {createDemoLivingMapScene} from '../app/services/demoLivingMapScene.js';
import {createDemoLivingMapXR} from '../app/services/demoLivingMapXR.js';
const gl=document.querySelector('canvas').getContext('webgl'),model=createDemoLivingMapConcept({interactive:true}),placement=createDemoLivingMapPlacement(model),scene=createDemoLivingMapScene(model,{placement});
for(let i=0;i<3;i++){const target=placement.current(10000+i*4000);placement.place(target.id,10000+i*4000);}
const originalExtension=gl.getExtension.bind(gl);if(location.search.includes('fallback'))gl.getExtension=name=>name==='OES_vertex_array_object'?null:originalExtension(name);
let renderer=createDemoLivingMapXR(gl,scene.scene),errors=0,frames=0,lastError=0;
const compile=(type,text)=>{const shader=gl.createShader(type);gl.shaderSource(shader,text);gl.compileShader(shader);return shader;};
const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,'precision mediump float;void main(){gl_FragColor=vec4(1.);}'));gl.linkProgram(program);
const panelBuffer=gl.createBuffer(),p=gl.getAttribLocation(program,'p');gl.bindBuffer(gl.ARRAY_BUFFER,panelBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.95,.9,-.55,.9,-.75,.5]),gl.STATIC_DRAW);gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
const camera=new THREE.PerspectiveCamera(58,1000/650,.05,20);camera.position.set(0,1.6,0);camera.lookAt(0,1.05,-1.15);camera.updateMatrixWorld();const view={projectionMatrix:camera.projectionMatrix.elements,transform:{inverse:{matrix:camera.matrixWorldInverse.elements}}};
document.querySelector('#dispose').onclick=()=>{renderer?.destroy();renderer=null;scene.dispose();};document.querySelector('#fallback').onclick=()=>location.search='fallback';document.querySelector('#restart').onclick=()=>location.search='';
function draw(now){gl.viewport(0,0,1000,650);gl.clearColor(.05,.12,.07,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(renderer){scene.update(20000+now,false);renderer.draw(view,{x:0,y:1.05,z:-1.15},0,1,scene.totemLabel(20000+now));}gl.disable(gl.DEPTH_TEST);gl.useProgram(program);gl.drawArrays(gl.TRIANGLES,0,3);lastError=gl.getError();if(lastError)errors++;frames++;document.querySelector('#status').textContent=`${renderer?'Map active':'After map disposal'} · ${location.search?'Fallback':'Private VAO'} · GL error ${lastError} · errors ${errors} · frames ${frames}`;requestAnimationFrame(draw);}
requestAnimationFrame(draw);
</script></html>
