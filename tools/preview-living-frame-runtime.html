<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Frame · runtime review</title>
<link rel="stylesheet" href="../app/style.css"><link rel="stylesheet" href="../app/pim.css"><link rel="stylesheet" href="../app/product-v2.css"><link rel="stylesheet" href="../app/living-objects.css"><link rel="stylesheet" href="../app/note-widgets.css">
<style>body{margin:0;background:#142326;color:#f2f4e8}#review-controls{position:fixed;top:0;left:0;right:0;z-index:999999;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;background:#132522f5;font:14px system-ui}#review-controls button{padding:8px 12px;background:#344e46;border:1px solid #9aa58c;color:#fff;border-radius:8px}#review-controls button[aria-pressed=true]{background:#657856}#report{position:fixed;bottom:0;left:0;right:0;z-index:999999;padding:8px;margin:0;font:12px monospace;pointer-events:none;background:#132522e8;white-space:pre-wrap}#stereo{position:fixed;inset:62px 0 44px;width:100%;height:calc(100% - 106px);background:#142326}#stereo[hidden]{display:none}</style></head><body>
<header id="review-controls"><strong>Living Frame runtime</strong><span id="version"></span><button data-quality="off">No Living Frame</button><button data-quality="sd">LF SD</button><button data-quality="hd">LF HD</button><button id="mode">Test native stereo</button><button id="growth">Watch growth</button><button id="finish">Blooming finish</button></header><main id="app"></main><canvas id="stereo" hidden></canvas><pre id="report">Preloading the selected artwork…</pre>
<script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
import {startTemporaryArDemo} from '../app/screens/temporaryArDemo.js';
import {prepareLivingFrameModel,createLivingFrameModel,LIVING_FRAME_GROWTH_DURATION_MS} from '../app/services/livingFrameModel.js';
import {getSpatialVisualSettings,setSpatialVisualSettings} from '../app/services/spatialVisualSettings.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
window.renderLaunchScreen=()=>location.href='../app/index.html';
const report=document.querySelector('#report'),stereo=document.querySelector('#stereo');let native=false,started=performance.now()-LIVING_FRAME_GROWTH_DURATION_MS,loading=false,lastUpdate=0,cpu=[],loadedAt=0;
const gl=stereo.getContext('webgl2',{antialias:true}),model=createLivingFrameModel({onChange:()=>{loadedAt=performance.now();}}),anchor=new THREE.Matrix4();if(gl)model.setContext(gl);
const loadStarted=performance.now();await prepareLivingFrameModel();const preloadedMs=Math.round(performance.now()-loadStarted);
await startTemporaryArDemo(document.querySelector('#app'),{refinementPreview:'intro',livingFramePreviewClock:()=>performance.now()-started});
for(const button of document.querySelectorAll('[data-quality]'))button.onclick=()=>{setSpatialVisualSettings({livingFrameQuality:button.dataset.quality});model.update(performance.now()-started);cpu=[];};
document.querySelector('#mode').onclick=()=>{native=!native;stereo.hidden=!native;document.querySelector('#app').hidden=native;document.querySelector('#mode').textContent=native?'Return to demo':'Test native stereo';};
document.querySelector('#growth').onclick=()=>{started=performance.now();cpu=[];};document.querySelector('#finish').onclick=()=>{started=performance.now()-LIVING_FRAME_GROWTH_DURATION_MS;cpu=[];};
window.addEventListener('error',event=>report.textContent='ERROR: '+event.message);
function tick(now){requestAnimationFrame(tick);const quality=getSpatialVisualSettings().livingFrameQuality;
 const elapsed=now-started;model.update(elapsed,{show:native,frameToken:now});for(const button of document.querySelectorAll('[data-quality]'))button.setAttribute('aria-pressed',String(button.dataset.quality===quality));
 if(native&&gl){const width=Math.max(2,Math.round(stereo.clientWidth)),height=Math.max(1,Math.round(stereo.clientHeight));if(stereo.width!==width||stereo.height!==height){stereo.width=width;stereo.height=height;}gl.clearColor(.06,.11,.12,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const start=performance.now();
  for(let eye=0;eye<2;eye++){const camera=new THREE.PerspectiveCamera(38,(width/2)/height,.01,20);camera.position.set(eye===0?-.032:.032,-.3,4.4);camera.lookAt(0,-.3,0);camera.updateMatrixWorld();gl.viewport(eye*width/2,0,width/2,height);model.drawXR({projectionMatrix:camera.projectionMatrix.elements,transform:{inverse:{matrix:camera.matrixWorldInverse.elements}}},anchor.elements);}cpu.push(performance.now()-start);if(cpu.length>180)cpu.shift();
 }
 if(now-lastUpdate>250){lastUpdate=now;const samples=[...cpu].sort((a,b)=>a-b),requests=performance.getEntriesByType('resource').filter(r=>r.name.includes('/living-frame/living-frame-')).map(r=>new URL(r.name).pathname.split('/').at(-1));report.textContent=JSON.stringify({quality,preloadedMs,requests,modelReady:model.ready,growthSeconds:Math.round(model.growthTime*10)/10,nativeStereo:native,renderStats:model.renderStats,cpuP95Ms:samples.length?Math.round(samples[Math.floor(samples.length*.95)]*100)/100:null,error:model.error?.message||null});}
}requestAnimationFrame(tick);
window.addEventListener('pagehide',()=>model.destroy(),{once:true});
</script></body></html>
