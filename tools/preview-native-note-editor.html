<!doctype html><html lang="en"><meta charset="utf-8"><title>Native Note keyboard review</title>
<style>body{margin:24px;background:#405c50;color:white;font:18px system-ui}#picture{width:720px;max-width:100%;display:block}nav{max-width:950px;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px;color:white;background:#23483c;border:1px solid #c7e7d1;border-radius:10px}#source{display:none}pre{white-space:pre-wrap}</style>
<h1>Native Note editor · no page capture</h1><p>These buttons use the same pixel-hit actions as a Quest Trigger. The canvas is the production keyboard/editor artwork.</p><button id="open">Open Note editor</button><button id="idle">Check idle texture budget</button><p id="status" role="status"></p><canvas id="picture" width="720" height="620"></canvas><nav id="actions" aria-label="Native editor hit targets"></nav><pre id="values"></pre><section id="source"></section><canvas id="gpu" hidden></canvas>
<script type="module">
import {createSpatialNoteEditor} from '../app/services/spatialNoteEditor.js';
import {mountSpatialNoteEditor} from '../app/services/noteEditorDialog.js';
import {createNoteWidget} from '../app/services/noteWidgets.js';
const root=document.getElementById('source'),picture=document.getElementById('picture'),actions=document.getElementById('actions'),status=document.getElementById('status'),values=document.getElementById('values'),gl=document.getElementById('gpu').getContext('webgl'),ctx=picture.getContext('2d');
const note={id:'native-editor-review',name:'Garden reminder',description:'Water gently and check the mulch.',appearance:{spatial_note:{type:'dynamic',widgets:[createNoteWidget('timer',{title:'Timer',configuration:{seconds:240}}),createNoteWidget('thick-box',{title:'Instructions',content:'Keep mulch clear of stems.'})]}}};
let editor=null,workspace=null;
window.addEventListener('error',event=>status.textContent='ERROR: '+event.message);window.addEventListener('unhandledrejection',event=>status.textContent='ERROR: '+event.reason);
function show(){if(!editor)return;ctx.clearRect(0,0,720,620);ctx.drawImage(editor.canvas,0,0);actions.replaceChildren();for(const region of editor.regions){const button=document.createElement('button');button.textContent=region.label;button.disabled=region.disabled;button.onclick=()=>{editor?.activateAt(region.x+region.width/2,region.y+region.height/2);show();};actions.append(button);}values.textContent='WebGL error: '+gl.getError()+' · texture uploads: '+editor.uploads+'\n'+[...root.querySelectorAll('input,textarea')].map(input=>(input.name || input.dataset.widgetField || input.dataset.widgetConfig || (input.hasAttribute('data-widget-minutes')?'Minutes':'Field'))+': '+input.value).join('\n');}
function close(){editor?.destroy();editor=null;workspace?.destroy();workspace=null;actions.replaceChildren();status.textContent='Back in demo · saved '+note.name+' · timer '+note.appearance.spatial_note.widgets[0].configuration.seconds+' seconds';values.textContent=JSON.stringify(note,null,2);}
function open(){editor?.destroy();workspace?.destroy();workspace=mountSpatialNoteEditor(root,note,{onSave:async value=>Object.assign(note,value),onClose:close});editor=createSpatialNoteEditor({gl,root,onStatus:message=>status.textContent=message});status.textContent='Editor ready · no capture or loading screen';show();}
document.getElementById('open').onclick=open;document.getElementById('idle').onclick=()=>{if(!editor)return;const before=editor.uploads;let frames=0;const tick=()=>{if(!editor)return;if(++frames<30){requestAnimationFrame(tick);return;}status.textContent='Idle 30 frames · '+(editor.uploads-before)+' additional uploads';show();};requestAnimationFrame(tick);};open();
</script></html>
