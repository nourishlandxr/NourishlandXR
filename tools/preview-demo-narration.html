<!doctype html><html lang="en"><meta charset="utf-8"><title>Nourishland demo narration review</title><style>body{margin:24px;background:#202d29;color:#fffaf0;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:24px}article{border:1px solid #65766c;padding:12px}canvas{width:100%;background:#34433b}button{width:44px;height:44px;border-radius:8px;margin:4px;font-size:20px}select{max-width:90%;padding:10px}</style><h1>Demo text and saved Zinnia narration</h1><p>Select a paragraph and play its exact saved recording. Text reveals when playback starts; preceding paragraphs remain visible.</p><main></main><script type="module">
import {DEMO_GUIDED_STEPS} from '../app/features/ar-demo/demoJourneyContent.js';
import {DEMO_NARRATION_BANK} from '../app/services/demoNarrationBank.js';
import {normalizeNarrationText} from '../app/services/projectNarration.js';
import {drawWelcomeText} from '../app/services/welcomeSpeechPresentation.js';
window.review={results:[]};
for(const step of DEMO_GUIDED_STEPS){const article=document.createElement('article'),heading=document.createElement('h2'),canvas=document.createElement('canvas'),select=document.createElement('select'),play=document.createElement('button'),audio=new Audio();canvas.width=1400;canvas.height=1080;heading.textContent=step.id+' · '+step.title;play.textContent='▶';play.setAttribute('aria-label','Play or pause selected paragraph');const paragraphs=step.main.split(/\n\n+/),ctx=canvas.getContext('2d');paragraphs.forEach((text,i)=>select.add(new Option((i+1)+'. '+text,i)));let shown=paragraphs.length;
const paint=()=>{ctx.clearRect(0,0,1400,1080);ctx.fillStyle='#fffaf0';drawWelcomeText(ctx,{title:step.title,caption:paragraphs.slice(0,shown).join('\n\n'),layoutCaption:step.main,width:960,top:330,bottom:835,titleSize:56,bodySize:40});};
const marks=[],fill=ctx.fillText.bind(ctx);ctx.fillText=(text,x,y,...args)=>{marks.push({text,x,y,font:ctx.font});fill(text,x,y,...args);};paint();review.results.push({id:step.id,marks});
select.onchange=()=>{audio.pause();play.textContent='▶';shown=Number(select.value);paint();};play.onclick=()=>{if(!audio.paused){audio.pause();play.textContent='▶';return;}const clip=Object.values(DEMO_NARRATION_BANK.catalog).find(c=>c.text===normalizeNarrationText(paragraphs[Number(select.value)]));if(!clip){play.title='Recording pending';return;}audio.src='../app/'+DEMO_NARRATION_BANK.base+clip.file;audio.play();};audio.onplaying=()=>{shown=Number(select.value)+1;play.textContent='Ⅱ';paint();};audio.onended=()=>{play.textContent='▶';};article.append(heading,canvas,select,play);document.querySelector('main').append(article);}
</script></html>
