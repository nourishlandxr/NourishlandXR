<!doctype html><html lang="en"><meta charset="utf-8"><title>Note showcase · XR interaction review</title>
<style>body{margin:24px;background:#304a42;color:white;font:18px system-ui}button{padding:10px 14px;font:inherit;color:white;background:#2c554a;border:1px solid #b6d9c9;border-radius:12px}nav{display:flex;flex-wrap:wrap;gap:8px}canvas{display:block;width:100%;max-width:1400px;margin-top:18px;background:#1b302a}#source,#panels{position:fixed;left:-20000px;pointer-events:none}output{display:block;margin:16px 0}</style>
<h1>Note · simple spatial showcase</h1><p>Actual Note cards, Control panel and XR event routing. Pencil previews sample wording on the Note; + extends an arm before choosing a widget. No keyboard or detached authoring form.</p>
<nav><button id="open">Open Note</button><button id="edit">XR · Control panel pencil</button><button id="noteedit">XR · Note pencil after timer tick</button><button id="sample">XR · Try sample edit</button><button id="reset">XR · Reset text</button><button id="done">XR · Done editing</button><button id="add">XR · Control panel +</button><button id="timer">XR · Timer choice</button><button id="start">XR · Start timer</button><button id="next">XR · Living Frame Continue</button></nav>
<output id="status">Preparing…</output><canvas id="surface" width="1400" height="700" aria-label="Rendered Note and connected widget arm beside the existing Control panel"></canvas><section id="source"></section><section id="panels"></section>
<script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {mountDemoNoteShowcase,demoNoteWidgetPlacement} from '../app/services/demoNoteShowcase.js';
import {createNoteSpatialRenderer,noteCardActionOffset} from '../app/services/noteSpatialRenderer.js';
import {createPimInfoPanel} from '../app/services/pimInfoPanel.js';
import {noteSurfaceOwnsRay} from '../app/services/demoNoteRouting.js';
import {hitTotemSurface,createSpatialTotemCards} from '../app/services/spatialTotemCards.js';
const canvas=document.getElementById('surface'),gl=canvas.getContext('webgl',{alpha:true,antialias:true}),root=document.getElementById('source'),status=document.getElementById('status');
const camera=new THREE.PerspectiveCamera(65,2,.05,20);camera.position.set(0,1.6,0);camera.updateMatrixWorld();
// Off-centre preview projection keeps the below-eye Control panel in view.
camera.projectionMatrix.elements[9]=-.38;
const viewer=camera.matrixWorld.elements,view={projectionMatrix:camera.projectionMatrix.elements,transform:{matrix:viewer,inverse:{matrix:camera.matrixWorldInverse.elements}}};
const note={id:'showcase-note',demoType:'note',name:'Care for this place',description:'Observe the soil. Water gently at the roots.',position:{x:.32,y:1.3,z:-1.5},appearance:{spatial_note:{type:'dynamic',widgets:[]}}};
const session=new EventTarget(),source={targetRayMode:'tracked-pointer',targetRaySpace:{},gripSpace:{},gamepad:{axes:[0,0,0,0]}};session.inputSources=[source];session.visibilityState='visible';
let ray=null,matrix=new THREE.Matrix4(),workspace=null,native=null,continued=0,changes=0,lastAction='Ready';
const panel=createPimInfoPanel({root:document.getElementById('panels'),headset:true});panel.attach(gl);panel.bindSession(session,{});
const nextSurface={center:{x:.9,y:1,z:-1.3},right:{x:1,y:0,z:0},up:{x:0,y:1,z:0},normal:{x:0,y:0,z:1},width:.35,height:.13,card:{id:'continue'}};
const next=createSpatialTotemCards(gl,{canvas:()=>{const c=document.createElement('canvas');c.width=512;c.height=200;const x=c.getContext('2d');x.fillStyle='rgba(110,180,140,.3)';x.fillRect(0,0,512,200);x.font='600 64px system-ui';x.fillStyle='#fff';x.textAlign='center';x.fillText('Continue',256,125);return c;},surfaces:()=>[nextSurface]});
function focus(){panel.restore();panel.showLearning({title:note.name,body:note.description,mesh:'note'});panel.setObjectContext({title:'Controls · Note',hint:'Demo showcase · full authoring later',actions:[{id:'edit',label:'✎ Edit preview'},{id:'add',label:'+ Add widget'},{id:'toggle',label:'Show / hide widgets'}],onAction:id=>{workspace?.action(id);lastAction='Control panel '+id;}});panel.setExplorerOpen(true);}
function close(){native?.destroy();native=null;workspace?.destroy();workspace=null;}
function open(){close();workspace=mountDemoNoteShowcase(root,note,{onChange:()=>{changes++;focus();},onClose:close});native=createNoteSpatialRenderer(gl,root,note,viewer,{widgetPlacement:demoNoteWidgetPlacement});focus();lastAction='Note ready';}
panel.setRayFilter(inputRay=>!noteSurfaceOwnsRay(native?.hit(inputRay),[panel.hit(inputRay),hitTotemSurface(inputRay,[nextSurface])]));
session.addEventListener('select',()=>{if(noteSurfaceOwnsRay(native?.hit(ray),[panel.hit(ray),hitTotemSurface(ray,[nextSurface])])){native.activate(ray);lastAction='Note ray selected';return;}if(hitTotemSurface(ray,[nextSurface])){continued++;close();lastAction='Continue reached while Note was open';}});
function press(point){const origin=new THREE.Vector3(0,1.6,0),direction=new THREE.Vector3(point.x,point.y,point.z).sub(origin).normalize();ray={origin,direction};matrix.compose(origin,new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),direction),new THREE.Vector3(1,1,1));const frame={getPose:()=>({transform:{matrix:matrix.elements}})};for(const type of ['selectstart','selectend','select']){const e=new Event(type,{cancelable:true});Object.defineProperties(e,{inputSource:{value:source},frame:{value:frame}});session.dispatchEvent(e);}}
function cardPress(id,selector){const element=id==='main'?root.querySelector('.note-anchor'):root.querySelector('[data-note-widget="'+id+'"]'),buttons=[...element?.querySelectorAll('button,input') || []];if(id==='main')buttons.push(root.querySelector('[data-note-close]'));const i=buttons.indexOf(element?.querySelector(selector));if(i<0){lastAction='Missing action '+selector;return;}const widgets=[...root.querySelectorAll('[data-note-widget]')],index=widgets.findIndex(item=>item.dataset.noteWidget===id),bays=demoNoteWidgetPlacement(widgets.length),center=id==='main'?{x:.32,y:1.55,z:-1.5}:{x:.32+bays[index].x,y:1.55+bays[index].y,z:-1.5},offset=noteCardActionOffset(i);
 press({x:center.x+offset.x,y:center.y+offset.y,z:center.z});}
function controlPress(index){const p=panel.getPosition(),basis=panel.getPerchPose(),height=200/1000*.84,offset=.588/2+height/2+.035,x=(22+(index%2)*484+232)/1000-.5,y=.5-(62+Math.floor(index/2)*66+27)/200;
 const center=new THREE.Vector3(p.x,p.y,p.z).addScaledVector(new THREE.Vector3(basis.up.x,basis.up.y,basis.up.z),-offset).addScaledVector(new THREE.Vector3(basis.right.x,basis.right.y,basis.right.z),x*.84).addScaledVector(new THREE.Vector3(basis.up.x,basis.up.y,basis.up.z),y*height);press(center);}
document.getElementById('open').onclick=open;document.getElementById('edit').onclick=()=>controlPress(0);document.getElementById('add').onclick=()=>controlPress(1);
document.getElementById('noteedit').onclick=()=>cardPress('main','[data-demo-note="edit"]');
for(const id of ['sample','reset','done'])document.getElementById(id).onclick=()=>cardPress('main','[data-demo-note="'+(id==='done'?'done-edit':id)+'"]');
document.getElementById('timer').onclick=()=>cardPress('demo-add-arm','[data-demo-note="widget:timer"]');document.getElementById('start').onclick=()=>{const widget=note.appearance.spatial_note.widgets.find(item=>item.type==='timer');if(widget)cardPress(widget.id,'[data-widget-action="start"]');};
document.getElementById('next').onclick=()=>press(nextSurface.center);
window.addEventListener('error',event=>{lastAction='ERROR: '+event.message;});
function draw(time){requestAnimationFrame(draw);panel.update(viewer,time,ray);gl.viewport(0,0,1400,700);gl.clearColor(.11,.19,.16,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);panel.draw(view);native?.draw(view,viewer);next.begin();next.draw(view,{id:'living-frame'},nextSurface.center,[nextSurface.card]);next.end();status.textContent=lastAction+' · text changes '+changes+' · widgets '+note.appearance.spatial_note.widgets.length+' · Continue '+continued+' · GL '+gl.getError();}open();draw(performance.now());
</script></html>
