<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zinnia · demo introduction</title><style>
body{margin:0;background:#1c2b23;color:#eeefdf;font:16px system-ui}header{padding:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button{border:1px solid #92a88e;background:#35513d;color:#f2f3e8;padding:12px 18px;border-radius:9px;cursor:pointer}button:disabled{opacity:.35;cursor:default}canvas{display:block;width:100%;height:75vh}#copy{position:absolute;top:190px;left:50%;transform:translateX(-50%);width:min(290px,calc(100vw - 120px));text-align:center;pointer-events:none}h2{font-size:25px}p{line-height:1.6}footer{padding:16px;text-align:center}small{color:#bdccb8}#continue{min-width:160px}</style></head><body>
<header><strong>Zinnia · right-side branch</strong><span id="version"></span><button id="fresh">Demo without tutorial</button><button id="return">After tutorial</button><small>Silent layout preview · actual demo uses Zinnia’s narration.</small></header><canvas></canvas><section id="copy"><h2></h2><p></p></section><footer><button id="continue" disabled>Continue</button><p id="status">Loading Zinnia…</p></footer>
<script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
import {prepareLivingFrameModel} from '../app/services/livingFrameModel.js';
import {createZinniaFramePerch} from '../app/services/zinniaFramePerch.js';
import {createDemoVoiceTextFlow} from '../app/services/demoVoiceTextFlow.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(49,1,.01,20);camera.position.set(0,1.55,.3);camera.lookAt(0,1.5,-2);
scene.add(new THREE.HemisphereLight('#e5e8d2','#2b3627',2));const key=new THREE.DirectionalLight('#eddfbd',2);key.position.set(-2,4,3);scene.add(key);
const frameHome=new THREE.Group();frameHome.position.set(0,1.48,-2);scene.add(frameHome);
const perch=createZinniaFramePerch();perch.root.matrix.makeTranslation(0,1.48,-2);scene.add(perch.scene);
void prepareLivingFrameModel('sd').then(entry=>{const model=entry.asset.scene.clone(true);const mixer=new THREE.AnimationMixer(model);for(const clip of entry.asset.animations)mixer.clipAction(clip).play();mixer.setTime(43);frameHome.add(model);perch.matchRim(model);}).catch(error=>document.querySelector('#status').textContent=error.message);
let flow=null,mode='fresh';const button=document.querySelector('#continue'),status=document.querySelector('#status');
const silentVoice={speak(text,options){options.onComplete();},stop(){},status:()=>({muted:true,playing:false}),pause(){},resume(){}};
function begin(returning=false){flow?.cancel();mode=returning?'return':'fresh';button.disabled=true;button.textContent='Continue';document.querySelector('#copy h2').textContent=returning?'Welcome back':'Meet Zinnia';status.textContent=returning?'Introduction bypassed · already met in tutorial':'New visitor · Zinnia introduces herself';
 const paragraphs=returning?['Hello again. I’m over here—let’s see what this place could become.']:['Hi, my name is Zinnia. I’ll be your guide here in Nourishland XR.','Let me introduce myself properly. Here I am—a little flower with a face, to keep you company.','Get comfortable and leave a little clear space around you. There is no hurry.'];
 flow=createDemoVoiceTextFlow({paragraphs,voice:silentVoice,readingTime:text=>Math.max(2400,text.split(/\s+/).length*170),onChange:event=>document.querySelector('#copy p').textContent=event.paragraph,onComplete:()=>{button.disabled=false;status.textContent='Ready · Continue is unlocked';}});flow.start();}
document.querySelector('#fresh').onclick=()=>begin(false);document.querySelector('#return').onclick=()=>begin(true);button.onclick=()=>{document.querySelector('#copy h2').textContent='Imagine a place to learn';document.querySelector('#copy p').textContent='Plants, people and place—connected through living knowledge.';status.textContent='Advanced to IMAGINE';button.disabled=true;};
function resize(){const h=Math.max(440,innerHeight*.75);renderer.setSize(innerWidth,h,false);camera.aspect=innerWidth/h;camera.position.z=Math.max(2.3,1.35/(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect))-2;camera.lookAt(0,1.48,-2);camera.updateProjectionMatrix();document.querySelector('#copy').style.top=(document.querySelector('header').offsetHeight+h*.25)+'px';}addEventListener('resize',resize);resize();begin();
function draw(time){requestAnimationFrame(draw);if(document.hidden)return;camera.updateMatrixWorld();perch.update({transform:{matrix:camera.matrixWorld.elements}},perch.root.matrix.elements,time,[]);perch.characterMount.traverse(node=>{const morph=node.geometry?.morphAttributes;if(morph?.normal && morph.normal.length!==morph.position?.length)delete morph.normal;});renderer.render(scene,camera);}requestAnimationFrame(draw);
window.addEventListener('error',e=>status.textContent='ERROR: '+e.message);
</script></body></html>
