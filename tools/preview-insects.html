<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insect animation study</title>
<style>body{background:#24372d;color:#e2ead9;font:16px system-ui;margin:24px}main{max-width:1000px;margin:auto}.models{display:flex;gap:16px}canvas{width:45%;height:auto;background:#d1d9bd;border-radius:24px}button,select{font:inherit;padding:10px;color:inherit;background:#ffffff18;border:1px solid #b1c4a3;border-radius:18px}label{display:block;margin:16px 0}input{width:70%}#phase{color:#d9e6be}</style>
<main><h1>Bee and butterfly · production animation</h1><p>The butterfly rests with folded wings for one minute, then blends into flight. This study enlarges the actual sprites to inspect animation and clipping.</p><label>Timeline <input id="timeline" type="range" min="0" max="180" step="0.1" value="10"><output id="age">0:10</output></label><button id="perch">Perched</button> <button id="takeoff">Takeoff</button> <button id="fly">Flying</button> <button id="close">Close pass</button> <button id="motion">Pause</button><label>Graphics <select id="quality"><option value="low">LOW</option><option value="medium">MED</option><option value="high" selected>HIGH</option></select></label><p id="phase" role="status">Loading models…</p><div class="models"><canvas id="butterfly" aria-label="Animated butterfly"></canvas><canvas id="bee" aria-label="Bee wing animation"></canvas></div><p id="errors" role="status"></p></main>
<script type="module">
import {mountDemoButterflyModel} from '../app/services/demoButterflyModel.js';
import {mountDemoBeeModel} from '../app/services/demoBeeModel.js';
import {demoButterflyPose} from '../app/services/demoButterflyPose.js';
import {setSpatialVisualSettings} from '../app/services/spatialVisualSettings.js';
const butterfly=mountDemoButterflyModel(document.querySelector('#butterfly')),bee=mountDemoBeeModel(document.querySelector('#bee'),{sprite:true});
const timeline=document.querySelector('#timeline'),age=document.querySelector('#age');let seconds=10,last=performance.now(),playing=true;
function seek(value){seconds=value;timeline.value=String(value);}
for(const [id,time] of [['perch',10],['takeoff',62],['fly',80],['close',132]])document.querySelector('#'+id).onclick=()=>seek(time);
timeline.oninput=()=>seek(Number(timeline.value));document.querySelector('#motion').onclick=event=>{playing=!playing;event.target.textContent=playing?'Pause':'Play';};
document.querySelector('#quality').onchange=event=>setSpatialVisualSettings({graphicsQuality:event.target.value});setSpatialVisualSettings({graphicsQuality:'high'});
window.addEventListener('error',event=>{document.querySelector('#errors').textContent=event.message;});
function frame(now){if(playing)seconds+=(now-last)/1000;last=now;timeline.value=String(seconds);age.textContent=Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0');const pose=demoButterflyPose(seconds*1000,0);butterfly.renderSprite(seconds*1000,pose);bee.renderSprite(seconds*1000,0);document.querySelector('#phase').textContent=`Butterfly: ${butterfly.ready?pose.state:'loading'} · Bee: ${bee.ready?'ready':'loading'} · Close approach: ${pose.close.toFixed(2)}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
