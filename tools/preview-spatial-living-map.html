<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial landscape mechanics · stereo renderer</title>
<style>body{margin:0;background:#18291f;color:#f4f2df;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}canvas{width:100%;aspect-ratio:2}button{padding:12px;margin:4px;background:#31513c;color:white;border:1px solid #bdd49c;border-radius:12px}output{display:block;margin:12px 0}</style>
<main><h1>Native spatial landscape · two-grip stereo test</h1><p>Grip both raised handles, then turn or tilt. Release either grip to stop. Laser beams stay attached while held, even when the controller points elsewhere. These controls feed simulated XR poses into the production grip handler.</p><canvas id="stereo"></canvas><output id="status"></output><button id="left">Grip left handle</button><button id="right">Grip right handle</button><button id="turn">Turn plate</button><button id="tilt">Tilt plate</button><button id="aim">Aim elsewhere</button><button id="mode">Use direct grips</button><button id="place">Place next Totem</button><button id="replay">Replay reveal</button><a href="preview-demo-living-map.html">Integrated demo</a></main>
<script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {createDemoLivingMapConcept,createDemoLivingMapPlacement} from '../app/services/demoLivingMapModel.js';
import {createDemoLivingMapScene} from '../app/services/demoLivingMapScene.js';
import {createDemoLivingMapXR} from '../app/services/demoLivingMapXR.js';
import {livingMapReveal,livingMapWorldPoint,livingMapRayPoint,livingMapWorldDropAccepted} from '../app/services/demoLivingMapReveal.js';
import {createLivingMapGripInput} from '../app/services/demoLivingMapGrip.js';
import {LIVING_MAP_HANDLE_X} from '../app/services/demoLivingMapHandles.js';
import {createSpatialTetherRenderer,drawSpatialTether,drawSpatialPointerContact,destroySpatialTetherRenderer} from '../app/services/spatialTetherRenderer.js';
const model=createDemoLivingMapConcept({interactive:true}),placement=createDemoLivingMapPlacement(model),scene=createDemoLivingMapScene(model,{placement});
const canvas=document.querySelector('canvas');canvas.width=1100;canvas.height=550;
const gl=canvas.getContext('webgl',{alpha:false,antialias:true}),renderer=createDemoLivingMapXR(gl,scene.scene);
const origin={x:0,y:1.05,z:-1.15},handCenter={...origin};let yaw=0,tilt=0,rotation=new THREE.Quaternion(),started=performance.now(),checks=0,laserMode=true,aimAway=false;
const tether=createSpatialTetherRenderer(gl);
const session=new EventTarget(),space={},left={handedness:'left',gripSpace:{},targetRaySpace:{},gamepad:{buttons:[{}, {pressed:false}]}},right={handedness:'right',gripSpace:{},targetRaySpace:{},gamepad:{buttons:[{}, {pressed:false}]}};session.inputSources=[left,right];
const xrFrame={getPose:key=>{
    const source=key===left.gripSpace || key===left.targetRaySpace?left:right,q=new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt,yaw,0,'YXZ'));
    const target=new THREE.Vector3((source===left?-1:1)*LIVING_MAP_HANDLE_X*.085,.03,0).applyQuaternion(q).add(new THREE.Vector3(handCenter.x,handCenter.y,handCenter.z));
    const position=laserMode?target.clone().add(new THREE.Vector3(0,.45,.65)):target;
    if(key===source.targetRaySpace){q.setFromRotationMatrix(new THREE.Matrix4().lookAt(position,laserMode?target:position.clone().add(new THREE.Vector3(0,0,-1)),new THREE.Vector3(0,1,0)));if(aimAway)q.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),1.1));}
    return {transform:{matrix:new THREE.Matrix4().compose(position,q,new THREE.Vector3(1,1,1)).elements}};
}};
const grip=createLivingMapGripInput({enabled:()=>livingMapReveal(performance.now()-started).ready,origin:()=>origin,rotation:()=>rotation,onRotate:q=>rotation=q,onMove:point=>Object.assign(origin,point)});grip.bind(session,space);
function toggle(source,button){source.gamepad.buttons[1].pressed=!source.gamepad.buttons[1].pressed;const event=new Event(source.gamepad.buttons[1].pressed?'squeezestart':'squeezeend',{cancelable:true});event.inputSource=source;event.frame=xrFrame;session.dispatchEvent(event);button.textContent=(source.gamepad.buttons[1].pressed?'Release ':'Grip ')+source.handedness+' handle';grip.update(xrFrame);}
const cameras=[-.032,.032].map(x=>{const camera=new THREE.PerspectiveCamera(58,1,.05,20);camera.position.set(x,1.6,0);camera.lookAt(x,1.05,-1.15);camera.updateMatrixWorld();return camera;});
document.querySelector('#left').onclick=event=>toggle(left,event.target);document.querySelector('#right').onclick=event=>toggle(right,event.target);
document.querySelector('#turn').onclick=()=>yaw+=.35;document.querySelector('#tilt').onclick=()=>tilt+=.15;
const carry=document.createElement('button');carry.id='carry';carry.textContent='Bring plate closer';document.querySelector('#tilt').after(carry);carry.onclick=()=>{handCenter.z+=.25;handCenter.y+=.1;};
function releaseGrips(){grip.reset();left.gamepad.buttons[1].pressed=false;right.gamepad.buttons[1].pressed=false;document.querySelector('#left').textContent='Grip left handle';document.querySelector('#right').textContent='Grip right handle';}
document.querySelector('#aim').onclick=event=>{aimAway=!aimAway;event.target.textContent=aimAway?'Aim at handles':'Aim elsewhere';};
document.querySelector('#mode').onclick=event=>{releaseGrips();laserMode=!laserMode;event.target.textContent=laserMode?'Use direct grips':'Use laser grips';};
document.querySelector('#replay').onclick=()=>{placement.reset();releaseGrips();Object.assign(origin,{x:0,y:1.05,z:-1.15});Object.assign(handCenter,origin);aimAway=false;document.querySelector('#aim').textContent='Aim elsewhere';yaw=0;tilt=0;rotation.identity();started=performance.now();checks=0;};
document.querySelector('#place').onclick=()=>{const elapsed=performance.now()-started,target=placement.current(elapsed);if(!livingMapReveal(elapsed).ready || !target)return;const world=livingMapWorldPoint(target,origin,rotation),normal=new THREE.Vector3(0,1,0).applyQuaternion(rotation),start=new THREE.Vector3(world.x,world.y,world.z).addScaledVector(normal,.5),release=livingMapRayPoint({origin:start,direction:normal.negate()},origin,rotation);if(!livingMapWorldDropAccepted(release,world))throw Error('Tilted release missed');if(placement.place(target.id,elapsed))checks++;};
function frame(now){const elapsed=now-started,reveal=livingMapReveal(elapsed);grip.update(xrFrame);scene.setHeldHandles(grip.heldHandles);scene.update(elapsed,false);gl.clearColor(.07,.13,.09,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);cameras.forEach((camera,i)=>{
    const view={projectionMatrix:camera.projectionMatrix.elements,transform:{matrix:camera.matrixWorld.elements,inverse:{matrix:camera.matrixWorldInverse.elements}}};
    gl.viewport(i*550,0,550,550);renderer.draw(view,origin,rotation,reveal.appear);
    if(laserMode)for(const source of session.inputSources){const contact=grip.contact(source);if(!contact)continue;const m=xrFrame.getPose(source.targetRaySpace).transform.matrix;
        drawSpatialTether(gl,tether,view,{x:m[12],y:m[13],z:m[14]},contact,{segments:4,width:.0025,curve:0,lift:0,color:[.72,.91,.83,.85]});drawSpatialPointerContact(gl,tether,view,contact,.014);}
});const error=gl.getError(),angle=new THREE.Vector3(0,1,0).applyQuaternion(rotation).angleTo(new THREE.Vector3(0,1,0))*180/Math.PI;document.querySelector('#status').textContent=`${reveal.ready?'Ready':'Revealing'} · GL error ${error} · ${checks}/3 releases · ${grip.active?'Both grips engaged':'Rotation stopped'} · ${grip.heldHandles.length} handle contacts · ${laserMode?'Laser':'Direct'} grips · tilt ${angle.toFixed(1)}°`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);addEventListener('pagehide',()=>{grip.destroy();renderer.destroy();destroySpatialTetherRenderer(gl,tether);scene.dispose();});
</script></html>
