<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial landscape mechanics · stereo renderer</title>
<style>body{margin:0;background:#18291f;color:#f4f2df;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}canvas{width:100%;aspect-ratio:2}button{padding:12px;margin:4px;background:#31513c;color:white;border:1px solid #bdd49c;border-radius:12px}output{display:block;margin:12px 0}</style>
<main><h1>Native spatial landscape · two-grip stereo test</h1><p>Grip both edges, then turn or tilt. Release either grip to stop. These controls feed simulated XR poses into the production grip handler.</p><canvas id="stereo"></canvas><output id="status"></output><button id="left">Grip left edge</button><button id="right">Grip right edge</button><button id="turn">Turn plate</button><button id="tilt">Tilt plate</button><button id="place">Place next Totem</button><button id="replay">Replay reveal</button><a href="preview-demo-living-map.html">Integrated demo</a></main>
<script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {createDemoLivingMapConcept,createDemoLivingMapPlacement} from '../app/services/demoLivingMapModel.js';
import {createDemoLivingMapScene} from '../app/services/demoLivingMapScene.js';
import {createDemoLivingMapXR} from '../app/services/demoLivingMapXR.js';
import {livingMapReveal,livingMapWorldPoint,livingMapRayPoint,livingMapWorldDropAccepted} from '../app/services/demoLivingMapReveal.js';
import {createLivingMapGripInput} from '../app/services/demoLivingMapGrip.js';
const model=createDemoLivingMapConcept({interactive:true}),placement=createDemoLivingMapPlacement(model),scene=createDemoLivingMapScene(model,{placement});
const canvas=document.querySelector('canvas');canvas.width=1100;canvas.height=550;
const gl=canvas.getContext('webgl',{alpha:false,antialias:true}),renderer=createDemoLivingMapXR(gl,scene.scene);
const origin={x:0,y:1.05,z:-1.15},handCenter={...origin};let yaw=0,tilt=0,rotation=new THREE.Quaternion(),started=performance.now(),checks=0;
const session=new EventTarget(),space={},left={handedness:'left',gripSpace:{},gamepad:{buttons:[{}, {pressed:false}]}},right={handedness:'right',gripSpace:{},gamepad:{buttons:[{}, {pressed:false}]}};session.inputSources=[left,right];
const xrFrame={getPose:key=>{const source=key===left.gripSpace?left:right,q=new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt,yaw,0,'YXZ')),position=new THREE.Vector3(source===left?-.51:.51,0,0).applyQuaternion(q).add(new THREE.Vector3(handCenter.x,handCenter.y,handCenter.z));return {transform:{matrix:new THREE.Matrix4().compose(position,q,new THREE.Vector3(1,1,1)).elements}};}};
const grip=createLivingMapGripInput({enabled:()=>livingMapReveal(performance.now()-started).ready,origin:()=>origin,rotation:()=>rotation,onRotate:q=>rotation=q,onMove:point=>Object.assign(origin,point)});grip.bind(session,space);
function toggle(source,button){source.gamepad.buttons[1].pressed=!source.gamepad.buttons[1].pressed;const event=new Event(source.gamepad.buttons[1].pressed?'squeezestart':'squeezeend',{cancelable:true});event.inputSource=source;event.frame=xrFrame;session.dispatchEvent(event);button.textContent=(source.gamepad.buttons[1].pressed?'Release ':'Grip ')+source.handedness+' edge';grip.update(xrFrame);}
const cameras=[-.032,.032].map(x=>{const camera=new THREE.PerspectiveCamera(58,1,.05,20);camera.position.set(x,1.6,0);camera.lookAt(x,1.05,-1.15);camera.updateMatrixWorld();return camera;});
document.querySelector('#left').onclick=event=>toggle(left,event.target);document.querySelector('#right').onclick=event=>toggle(right,event.target);
document.querySelector('#turn').onclick=()=>yaw+=.35;document.querySelector('#tilt').onclick=()=>tilt+=.15;
const carry=document.createElement('button');carry.id='carry';carry.textContent='Bring plate closer';document.querySelector('#tilt').after(carry);carry.onclick=()=>{handCenter.z+=.25;handCenter.y+=.1;};
document.querySelector('#replay').onclick=()=>{placement.reset();grip.reset();left.gamepad.buttons[1].pressed=false;right.gamepad.buttons[1].pressed=false;document.querySelector('#left').textContent='Grip left edge';document.querySelector('#right').textContent='Grip right edge';yaw=0;tilt=0;rotation.identity();started=performance.now();checks=0;};
document.querySelector('#place').onclick=()=>{const elapsed=performance.now()-started,target=placement.current(elapsed);if(!livingMapReveal(elapsed).ready || !target)return;const world=livingMapWorldPoint(target,origin,rotation),normal=new THREE.Vector3(0,1,0).applyQuaternion(rotation),start=new THREE.Vector3(world.x,world.y,world.z).addScaledVector(normal,.5),release=livingMapRayPoint({origin:start,direction:normal.negate()},origin,rotation);if(!livingMapWorldDropAccepted(release,world))throw Error('Tilted release missed');if(placement.place(target.id,elapsed))checks++;};
function frame(now){const elapsed=now-started,reveal=livingMapReveal(elapsed);grip.update(xrFrame);scene.update(elapsed,false);gl.clearColor(.07,.13,.09,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);cameras.forEach((camera,i)=>{gl.viewport(i*550,0,550,550);renderer.draw({projectionMatrix:camera.projectionMatrix.elements,transform:{inverse:{matrix:camera.matrixWorldInverse.elements}}},origin,rotation,reveal.appear,scene.totemLabel(elapsed));});const error=gl.getError(),angle=new THREE.Vector3(0,1,0).applyQuaternion(rotation).angleTo(new THREE.Vector3(0,1,0))*180/Math.PI;document.querySelector('#status').textContent=`${reveal.ready?'Ready':'Revealing'} · GL error ${error} · ${checks}/3 releases · ${grip.active?'Both grips engaged':'Rotation stopped'} · tilt ${angle.toFixed(1)}°`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);addEventListener('pagehide',()=>{grip.destroy();renderer.destroy();scene.dispose();});
</script></html>
