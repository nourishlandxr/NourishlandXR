<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NourishlandXR · wrist controls</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1917;color:#dcebe2;font:16px system-ui}header{padding:30px 40px;border-bottom:1px solid #2c4940}h1{margin:0 0 8px;font-size:26px}p{margin:6px 0;color:#a9c5b7}.stage{min-height:620px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 65%,#274b3d,#0e201c 65%);position:relative;overflow:hidden}.arm{position:absolute;width:500px;height:110px;left:calc(50% - 550px);top:calc(50% - 20px);background:linear-gradient(175deg,#70998b,#345b4d);border-radius:80px 20px 20px 80px;transform:rotate(-7deg);box-shadow:inset 0 4px 12px #97b7a8,inset 0 -10px 30px #29483e}.strap{position:absolute;left:calc(50% - 255px);top:calc(50% - 28px);width:46px;height:122px;border:8px solid #253c34;border-radius:22px;transform:rotate(-7deg)}canvas{position:relative;max-width:95vw;cursor:pointer;filter:drop-shadow(0 12px 18px #0006)}footer{padding:20px 40px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}button{border:1px solid #56796a;color:#e6eee5;background:#213d34;border-radius:6px;padding:12px 18px;cursor:pointer}button:focus-visible{outline:3px solid #b3ddcc}#hint{min-width:250px}#state{font-size:14px}
</style>
<header><h1>NourishlandXR · wrist controller</h1><p>Six icons on the forearm. Select a tool to open its controls beside the dock.</p></header>
<main class="stage"><div class="arm"></div><div class="strap"></div><canvas aria-label="Interactive wrist controller preview"></canvas></main>
<footer><button id="dock">Dock</button><button id="brush">Brush selector</button><button id="colours">Colours</button><button id="games">Games</button><span id="hint">Aim at an icon to see its name.</span><span id="state"></span></footer>
<script type="module">
import {createWelcomeComfortOptions} from '../app/services/welcomeComfortOptions.js';
import {drawWelcomeWristMenu,wristButtonAt} from '../app/services/welcomeWristMenu.js';
import {createSpatialPaintV2} from '../app/services/spatialPaintV2.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),paint=createSpatialPaintV2({markings:true});
const trials={active:null,mode:'controllers',paint,open(id){this.active=id;},close(){this.active=null;},command(){paint.clear();}};
let mode='controllers',muted=false,paused=false,hover=null,drag=null,pressed=null;
const stage={paint,trials,snapshot:()=>({phase:'brush',inputMode:mode,voice:{muted,paused},trials:{active:trials.active}}),button(id){if(id==='mute')muted=!muted;if(id==='pause')paused=!paused;},setInputMode(value){mode=value;trials.mode=value;},resetObjects(){paint.clear();},setTableHeightOffset(){}};
const menu=createWelcomeComfortOptions({stage,onChange:draw});
function draw(){const comfort=menu.context();canvas.width=1000;canvas.height=comfort.height;canvas.style.width=comfort.expanded?'760px':'326px';drawWelcomeWristMenu(ctx,{comfort,controls:comfort.items,hoverAction:hover?.action,hoverHint:hover?.ariaLabel});document.querySelector('#hint').textContent=hover?.ariaLabel || 'Aim at an icon to see its name.';document.querySelector('#state').textContent=paint.snapshot().brush+' · '+Math.round(paint.snapshot().width*1000)+' mm'+(trials.active?' · '+trials.active:'');}
function point(event){const r=canvas.getBoundingClientRect();return {x:(event.clientX-r.left)/r.width*1000,y:(event.clientY-r.top)/r.height*canvas.height};}
function slide(item,x){const fraction=Math.max(0,Math.min(1,(x-item.x-18)/(item.width-36)));menu.setValue(item.action.slice(8),item.min+fraction*(item.max-item.min));}
canvas.onpointermove=event=>{const p=point(event);if(drag)slide(drag,p.x);hover=wristButtonAt(menu.context().items,p.x,p.y);draw();};
canvas.onpointerdown=event=>{const p=point(event);pressed=wristButtonAt(menu.context().items,p.x,p.y);if(pressed?.disabled){pressed=null;return;}canvas.setPointerCapture(event.pointerId);if(pressed?.kind==='slider'){drag=pressed;slide(drag,p.x);}};
canvas.onpointerup=event=>{const p=point(event),target=wristButtonAt(menu.context().items,p.x,p.y);if(!drag && target && target.action===pressed?.action)menu.act(target.action.slice(8));drag=pressed=null;draw();};
canvas.onpointerleave=()=>{hover=null;draw();};
document.querySelector('#dock').onclick=()=>menu.act('home');document.querySelector('#brush').onclick=()=>{menu.act('home');menu.act('paint-tools');};document.querySelector('#colours').onclick=()=>menu.act('paint-page:colour');document.querySelector('#games').onclick=()=>{menu.act('home');menu.act('games');};draw();
</script></html>
