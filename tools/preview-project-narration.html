<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zinnia · guided voice preview</title><style>body{background:#14241e;color:#f3f6ee;font:18px/1.65 system-ui;margin:0}main{max-width:860px;margin:auto;padding:40px}h1{font:500 36px Georgia}button,select{font:inherit;padding:12px 20px;border:1px solid #afc6b1;border-radius:16px;background:#233d31;color:inherit;margin:6px 8px 6px 0}#copy{white-space:pre-line;padding:22px;border-left:2px solid #96bca4}small,#status{color:#c0d4c7}</style><main><small>NOURISHLANDXR · <span id="version"></span></small><h1>Zinnia’s voice through the journey</h1><p>The approved voice, with the text still visible.</p><label>Choose a screen <select id="screen"></select></label><nav><button id="listen">Listen</button><button id="pause">Pause</button><button id="stop">Stop</button></nav><p id="status" role="status">Choose a screen, then Listen.</p><h2 id="title"></h2><section id="copy"></section></main><script type="module">
import {createProjectNarration} from '../app/services/projectNarration.js';
import {DEMO_GUIDED_STEPS} from '../app/features/ar-demo/demoJourneyContent.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
const screens=[{id:'WELCOME 0.1',title:'Welcome to NourishlandXR',main:'We hope you are in a calm place, with plenty of clear space around you.\n\nGet comfortable. Relax your shoulders, keep your movements gentle, and take your time.\n\nWhen you feel ready, let’s imagine what this space could become.'},...DEMO_GUIDED_STEPS],select=document.querySelector('#screen');
for(const s of screens){const o=document.createElement('option');o.textContent=s.id+' · '+s.title;o.value=s.id;select.append(o);}
const narrator=createProjectNarration({onChange:s=>{document.querySelector('#status').textContent=s.paused?'Paused':s.playing?'Zinnia is speaking':s.muted?'Voice is off in Sound settings':'Ready';}});
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
const current=()=>screens.find(s=>s.id===select.value);function show(){narrator.stop();document.querySelector('#title').textContent=current().title;document.querySelector('#copy').textContent=current().main;}
select.onchange=show;document.querySelector('#listen').onclick=()=>{narrator.unlock();narrator.speak(current().main);};document.querySelector('#pause').onclick=()=>{if(narrator.status().paused)narrator.resume();else narrator.pause();};document.querySelector('#stop').onclick=narrator.stop;window.addEventListener('pagehide',()=>narrator.destroy());show();
</script></html>
