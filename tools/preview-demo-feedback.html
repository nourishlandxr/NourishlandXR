<!doctype html><html lang="en"><meta charset="utf-8"><title>Demo audio feedback check</title><link rel="stylesheet" href="../app/living-objects.css"><style>body{background:#14271f;color:#dae7d7;font:20px system-ui;padding:3rem}button{padding:1rem;margin:.5rem;background:#294638;color:inherit;border:1px solid #92a890;border-radius:12px}</style><h1>Demo audio feedback</h1><p>Music: Hiroshi Yoshimura — Wet Land. Streamed at a quiet level.</p><button id="begin">Begin music</button><button data-tone="menu">Menu</button><button data-tone="placement">Place Orb</button><button data-tone="cell">Cell crystal</button><button data-tone="totem">Totem</button><button id="stop">Stop</button><output id="status">Ready</output><script type="module">
import {createDemoFeedback} from '../app/services/demoFeedback.js';
import {createPimInfoPanel} from '../app/services/pimInfoPanel.js';
let feedback=createDemoFeedback();
const panel=createPimInfoPanel({root:document.body,demoSound:{volumes:()=>feedback.volumes(),setVolume:(kind,value)=>feedback.setVolume(kind,value),setHaptics:enabled=>feedback.setHaptics(enabled)}});
panel.showLearning({id:'sound-preview',title:'Demo sound settings',body:'Open Settings, then Sound, to adjust music and FX independently.',mesh:'lim'});
document.querySelector('#begin').onclick=()=>{feedback.start();document.querySelector('#status').textContent='Music requested · streaming';};
setInterval(()=>{const state=feedback.status();if(state.playing)document.querySelector('#status').textContent=`Music playing · media ready ${state.ready} · error ${state.error} · touch audio ${state.touchReady?'ready':'waiting'}`;},1000);
for(const button of document.querySelectorAll('[data-tone]'))button.onclick=()=>{feedback.sound(button.dataset.tone);document.querySelector('#status').textContent=button.textContent;};
document.querySelector('#stop').onclick=()=>{feedback.destroy();feedback=createDemoFeedback();document.querySelector('#status').textContent='Stopped';};
window.addEventListener('pagehide',()=>feedback.destroy());
</script></html>
