<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Frame sharp button review</title>
<style>body{background:#20342b;color:#f5faef;font:16px system-ui;margin:24px}section{display:flex;gap:24px;align-items:center;flex-wrap:wrap}canvas{width:420px;height:168px;max-width:100%}.far{width:210px;height:84px}h1{font-size:22px}button{font:inherit;padding:10px;background:#142d26;color:#f5faef;border:2px solid #bdd2c5;border-radius:12px}</style>
<h1>Living Frame button · <span id="version"></span></h1><p>Actual native artwork, near and distance-sized. No text shadow or translucent outline.</p><section><canvas id="near" aria-label="Near button artwork"></canvas><canvas id="far" class="far" aria-label="Distance-sized button artwork"></canvas></section><button id="aim">Show aimed state</button>
<script type="module">
import {drawLivingFrameButton} from '../app/services/livingFrameButton.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
document.querySelector('#version').textContent='V'+BUILD_INFO.version;
let aimed=false;function paint(){for(const canvas of document.querySelectorAll('canvas')){canvas.width=2048;canvas.height=1024;drawLivingFrameButton(canvas.getContext('2d'),'Start the demo',aimed);}}
document.querySelector('#aim').onclick=()=>{aimed=!aimed;document.querySelector('#aim').textContent=aimed?'Show resting state':'Show aimed state';paint();};paint();
</script></html>
