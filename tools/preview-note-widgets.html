<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Note widgets · content review</title>
<link rel="stylesheet" href="../app/note-widgets.css"><style>body{margin:16px;background:#18342b;color:#fffdf3;font:16px system-ui}main{max-width:1200px;margin:auto}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px;color:white;background:#315340;border:1px solid #bed4a5;border-radius:12px;font:inherit}canvas{width:100%;aspect-ratio:2;display:block;background:#163128;margin-top:16px}#dom{margin:24px auto}output{display:block;margin:12px 0}h1{font-size:24px}</style>
<main><h1>Compact Note widgets · <span id="version"></span></h1><p>Existing Note cards, extension positions and actions. Choose an action, spin its return date, check observations or view the sample photo.</p><nav><button id="harvest">Harvest · 10 days</button><button id="scion">Scion · 2 weeks</button><button id="plus">Date +1 week</button><button id="start">Set action date</button><button id="check">Checked for pests</button></nav><output id="status"></output><canvas id="xr" width="1400" height="700" aria-label="Native compact Note widgets"></canvas><section id="dom"></section></main>
<script type="module">
import * as THREE from '../app/vendor/three.module.min.js';
import {BUILD_INFO} from '../app/services/buildInfo.js';
import {DEMO_NOTE_WIDGETS,mountDemoNoteShowcase,demoNoteWidgetPlacement} from '../app/services/demoNoteShowcase.js';
import {createNoteWidget} from '../app/services/noteWidgets.js';
import {createNoteSpatialRenderer,noteCardActionOffset,noteSurfaceFacing} from '../app/services/noteSpatialRenderer.js';
const root=document.querySelector('#dom'),canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:true,antialias:true});
const record={id:'note-widget-review',type:'note',name:'Observe · care · return',description:'Fruit harvest in 10 days.\nScion ready in two weeks.',position:{x:0,y:1.4,z:-1.6},appearance:{spatial_note:{type:'dynamic',widgets:DEMO_NOTE_WIDGETS.map(sample=>createNoteWidget(sample.type,sample))}}};
const workspace=mountDemoNoteShowcase(root,record),camera=new THREE.PerspectiveCamera(65,2,.05,20);camera.position.set(0,1.6,0);camera.lookAt(0,1.4,-1.6);camera.updateMatrixWorld();const viewer=camera.matrixWorld.elements,view={projectionMatrix:camera.projectionMatrix.elements,transform:{inverse:{matrix:camera.matrixWorldInverse.elements}}},native=createNoteSpatialRenderer(gl,root,record,viewer,{widgetPlacement:demoNoteWidgetPlacement});
document.querySelector('#version').textContent=BUILD_INFO.version;
function press(type,action){const widget=record.appearance.spatial_note.widgets.find(item=>item.type===type),element=root.querySelector('[data-note-widget="'+widget.id+'"]'),actions=[...element.querySelectorAll('button,input')],index=actions.indexOf(element.querySelector('[data-widget-action="'+action+'"]')),i=record.appearance.spatial_note.widgets.indexOf(widget),bay=demoNoteWidgetPlacement(4)[i],offset=noteCardActionOffset(index,actions.length,Boolean(element.querySelector('p,li,small,img'))),origin=new THREE.Vector3(0,1.6,0),center={x:bay.x,y:1.4+bay.y,z:-1.6},facing=noteSurfaceFacing(center,viewer),point=new THREE.Vector3(center.x+facing.right.x*offset.x*(.70/.86),center.y+offset.y*(.264/.336),center.z+facing.right.z*offset.x*(.70/.86));native.activate({origin,direction:point.sub(origin).normalize()});}
for(const [id,action] of [['harvest','plan:harvest'],['scion','plan:scion'],['plus','date:7'],['start','start']])document.querySelector('#'+id).onclick=()=>press('timer',action);document.querySelector('#check').onclick=()=>press('checklist','check:1');
function draw(){gl.viewport(0,0,1400,700);gl.clearColor(.06,.15,.1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);native.draw(view,viewer);document.querySelector('#status').textContent='GL '+gl.getError()+' · '+JSON.stringify(record.demoNoteWidgetStates || {});requestAnimationFrame(draw);}draw();addEventListener('pagehide',()=>{native.destroy();workspace.destroy();});
</script></html>
