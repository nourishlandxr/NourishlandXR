<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Frame · microphone waveform</title><style>body{margin:0;background:#eee8da;color:#334339;font:15px/1.5 system-ui}main{max-width:980px;margin:auto;padding:20px}h1{font:32px Georgia,serif;margin:0}p{margin:10px 0 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{min-height:44px;padding:8px 14px;border:1px solid #8d9d89;background:#fffaf0;border-radius:8px;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{outline:2px solid #607e5d}#frame{display:block;width:100%;height:auto;border-radius:20px}#dom{margin-top:16px;padding:22px;background:#1f382c;color:#f3f0e5;border-radius:12px;display:grid;gap:16px}#dom h2{font:24px Georgia,serif;margin:0}#dom p{margin:0}#errors{color:#9c3827}</style>
<main><h1>Living Frame · microphone waveform</h1><p>Sample input for visual review. This page does not activate your microphone.</p><nav aria-label="Preview microphone level"><button data-level="0">Silence</button><button data-level="0.02">Soft speech</button><button data-level="0.065" aria-pressed="true">Speech</button><button data-error>Microphone unavailable</button></nav><canvas id="frame" width="1400" height="1080" aria-label="Living Frame with colourful microphone waveform aligned in its footer"></canvas><section id="dom"><h2>Create a Note with Zinnia</h2><p>Speak naturally. Choose Done when you have finished.</p></section><p id="errors" role="status"></p></main>
<script type="module">
import {drawDemoVoiceDetectionBar,mountDemoVoiceDetectionBar} from '../app/services/demoVoiceDetectionBar.js';
const canvas=document.querySelector('#frame'),ctx=canvas.getContext('2d'),dom=mountDemoVoiceDetectionBar(document.querySelector('#dom'));let level=.065,error=false;
document.querySelectorAll('[data-level]').forEach(button=>button.onclick=()=>{level=Number(button.dataset.level);error=false;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});document.querySelector('[data-error]').onclick=event=>{error=true;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===event.currentTarget)));};
function draw(time){ctx.clearRect(0,0,1400,1080);ctx.fillStyle='#1b3428';ctx.fillRect(0,0,1400,1080);ctx.strokeStyle='#799478';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(12,12,1376,1056,38);ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ede9db';ctx.font='44px Georgia';ctx.fillText('Let’s get to know you',700,220);ctx.font='37px system-ui';ctx.fillText('What is your favourite fruit?',700,390);ctx.fillStyle='#bfd3ba';ctx.font='29px system-ui';ctx.fillText('Speak naturally · choose Done when you have finished.',700,902);ctx.fillStyle='#81ae8c';ctx.beginPath();ctx.arc(700,600,35,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#173526';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(690,579,20,31,10);ctx.stroke();ctx.beginPath();ctx.arc(700,601,17,0,Math.PI);ctx.moveTo(700,618);ctx.lineTo(700,627);ctx.stroke();const state={listening:!error,voiceLevel:level,voiceError:error?'denied':null};drawDemoVoiceDetectionBar(ctx,state,{time});dom.render(state);window.voicePreviewState=state;window.requestAnimationFrame(draw);}window.requestAnimationFrame(draw);
</script></html>
