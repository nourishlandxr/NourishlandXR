<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Window · native stereo test</title><style>body{margin:20px;background:#122a22;color:#f2efdc;font:15px system-ui}canvas#stereo{width:min(100%,1100px);height:500px;background:#172b26;display:block}button,select{padding:10px;margin:6px;background:#395c47;color:white;border:1px solid #9cba9f;border-radius:8px}output{display:block;white-space:pre-wrap;margin:12px 0}</style></head><body><h1>Fruit Window · native stereo test</h1><p>Draws the real GLB in the shared XR renderer. Each pane uses a separate eye view.</p><canvas id="stereo" width="1600" height="750"></canvas><button id="grips" disabled>Test both grips</button><button data-action="play">Grow</button><button data-action="RIPE">Harvest</button><button data-action="pick">Pick</button><button data-action="return">Return</button><button id="next">Next example</button><output id="perf"></output><output id="photo"></output><output id="result">Loading corrected pigeon pea…</output><script type="module">
import * as THREE from '../app/assets/fruit-window/vendor/three.module.js';
import {createFruitWindowExperience} from '../app/services/fruitWindowExperience.js';
import {beginHandTrackingFrame} from '../app/services/xrPointer.js';
const budget=document.createElement('output');document.querySelector('#perf').after(budget);
const canvas=document.querySelector('#stereo'),gl=canvas.getContext('webgl2',{antialias:true}),result=document.querySelector('#result'),button=document.querySelector('#grips');
const windowModel=createFruitWindowExperience({identity:{plant:'Pigeon Pea'},onState:()=>{button.disabled=false;},onMedia:photo=>{const output=document.querySelector('#photo');output.textContent='Botanical photo ready: '+photo.caption;output.dataset.image=photo.image;}});let hoverRay=null,measuredAt=null,measuredFrames=0;
for(const kind of ['leaf','fruit']){const hoverButton=document.createElement('button');hoverButton.textContent='Test '+kind+' hover';button.after(hoverButton);hoverButton.onclick=()=>{const point=windowModel.getInteractionTargets()[kind];if(!point)return;hoverRay={origin:{x:point.x,y:point.y,z:point.z+.4},direction:{x:0,y:0,z:-1}};};}
windowModel.attach(gl);const session={inputSources:[]},space={};windowModel.bindSession(session,space);
const pose={center:{x:-.75,y:1.3,z:-1.2},right:{x:1,y:0,z:0},up:{x:0,y:1,z:0},normal:{x:0,y:0,z:1}};
const camera=new THREE.PerspectiveCamera(35,canvas.width/2/canvas.height,.01,20);const eyes=[-.032,.032].map(offset=>{const eye=camera.clone();eye.position.set(offset,1.3,.5);eye.lookAt(offset,1.3,-1.2);eye.updateMatrixWorld();return {projectionMatrix:eye.projectionMatrix.elements,transform:{inverse:{matrix:eye.matrixWorldInverse.elements}}};});
function transform(position){const matrix=new THREE.Matrix4().makeTranslation(position.x,position.y,position.z);return {position,orientation:{x:0,y:0,z:0,w:1},matrix:matrix.elements};}
const frame={getPose(target){return !target||target.lost?null:{transform:transform(target.point)};},getJointPose(joint){return {transform:transform(joint),radius:.008};}};
const handButton=document.createElement('button');handButton.textContent='Test hand fruit grab';button.after(handButton);
handButton.onclick=()=>{
 const assert=(value,message)=>{if(!value)throw Error(message);};
 try{
  windowModel.resetGrips();windowModel.action('RIPE');session.inputSources=[];
  let time=performance.now()+100;beginHandTrackingFrame(frame,time);windowModel.updateSpatial(pose,time,null,frame);
  const fruit=windowModel.getInteractionTargets().fruit;assert(fruit,'No ripe fruit target');
  const joints=new Map([['wrist',{...fruit,y:fruit.y-.1}],['thumb-tip',{...fruit,x:fruit.x+.005}],['index-finger-tip',{...fruit,x:fruit.x-.005}]]),hand={handedness:'left',hand:joints};session.inputSources=[hand];
  time+=16;beginHandTrackingFrame(frame,time);windowModel.updateSpatial(pose,time,null,frame);assert(windowModel.owns(hand),'Joint pinch did not acquire fruit');assert(windowModel.element.dataset.picked==='true','Fruit stayed attached');
  const before=windowModel.getInteractionTargets().fruit;for(const point of joints.values())point.x+=.1;
  time+=16;beginHandTrackingFrame(frame,time);windowModel.updateSpatial(pose,time,null,frame);const after=windowModel.getInteractionTargets().fruit;assert(Math.abs(after.x-before.x-.1)<.002,'Fruit did not follow the fingertips');
  joints.get('thumb-tip').x+=.08;time+=16;beginHandTrackingFrame(frame,time);windowModel.updateSpatial(pose,time,null,frame);assert(!windowModel.owns(hand),'Opening the hand did not release fruit');
  session.inputSources=[];windowModel.resetGrips();windowModel.action('return');result.textContent='PASS: joint-only pinch picks fruit, carries it by 10 cm and releases when the hand opens.';result.dataset.handTest='pass';
 }catch(error){session.inputSources=[];windowModel.resetGrips();result.textContent='FAIL: '+error.message;result.dataset.handTest='fail';}
};
function draw(time){windowModel.updateSpatial(pose,time,hoverRay,frame);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.055,.13,.10,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);for(let i=0;i<eyes.length;i++){gl.viewport(i*canvas.width/2,0,canvas.width/2,canvas.height);windowModel.draw(eyes[i]);}if(measuredAt===null)measuredAt=time;measuredFrames++;if(time-measuredAt>=500){const stats=windowModel.performanceSnapshot(),output=document.querySelector('#perf');output.textContent=Math.round(measuredFrames*1000/(time-measuredAt))+' browser callbacks/s · '+stats.modelUpdates+' mesh updates · '+stats.boundsUpdates+' bounds updates · '+(stats.playing?'development playing':'idle');Object.assign(output.dataset,stats);budget.textContent=JSON.stringify(stats.renderStats);result.dataset.glError=String(gl.getError());measuredAt=time;measuredFrames=0;}result.dataset.hover=windowModel.element.dataset.hover||'';result.dataset.hoverAmount=windowModel.element.dataset.hoverAmount||'0';requestAnimationFrame(draw);}requestAnimationFrame(draw);
function source(side){const point={x:side==='left'?-.345:.345,y:1.3,z:-.5};return {handedness:side,targetRaySpace:{point},gripSpace:{point},gamepad:{buttons:[{}, {pressed:true}]}};}
function event(type,inputSource){return windowModel.handleEvent({type,inputSource,frame});}
button.onclick=()=>{
    const assert=(value,message)=>{if(!value)throw Error(message);};
    try{
        windowModel.resetGrips();windowModel.anchor.position.set(0,1.3,-1.2);windowModel.anchor.quaternion.identity();const left=source('left'),right=source('right');session.inputSources=[left,right];
        assert(event('squeezestart',left),'Left handle did not acquire');windowModel.updateSpatial(pose,performance.now(),null,frame);const before=windowModel.anchor.position.clone();left.gripSpace.point.x+=.1;windowModel.updateSpatial(pose,performance.now(),null,frame);assert(windowModel.anchor.position.equals(before),'One grip moved the window');
        assert(event('squeezestart',right),'Right handle did not acquire');windowModel.updateSpatial(pose,performance.now(),null,frame);assert(windowModel.anchor.position.equals(before),'Second grip caused a jump');
        left.gripSpace.point.x+=.1;right.gripSpace.point.x+=.1;windowModel.updateSpatial(pose,performance.now(),null,frame);assert(Math.abs(windowModel.anchor.position.x-.1)<1e-6,'Both grips did not move together');
        assert(event('squeezeend',left),'Release was not owned');const frozen=windowModel.anchor.position.clone();right.gripSpace.point.y+=.2;windowModel.updateSpatial(pose,performance.now(),null,frame);assert(windowModel.anchor.position.equals(frozen),'One remaining grip moved the window');
        windowModel.resetGrips();windowModel.anchor.position.set(0,1.3,-1.2);result.textContent='PASS: one grip stays fixed; second grip joins without a jump; both move together; releasing either freezes movement.';result.dataset.gripTest='pass';
    }catch(error){result.textContent='FAIL: '+error.message;result.dataset.gripTest='fail';}
};
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>windowModel.action(button.dataset.action));document.querySelector('#next').onclick=()=>windowModel.nextExample();
</script></body></html>
